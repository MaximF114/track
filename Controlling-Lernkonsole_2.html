async function ladeVerlauf(){
  const box=document.getElementById('verlaufbox'); if(!box) return;
  if(!online){
    box.innerHTML='<div class="card"><div class="eyebrow">Nur mit Datenbank</div>'
      +'<p class="muted" style="margin:6px 0 0">Der Verlauf wird in Supabase gespeichert. Status: <b>'+esc(sbHinweis)+'</b>.</p></div>';
    return;
  }
  try{
    const runs = await sb.from('v_klausur_verlauf').select('*').order('gestartet_am',{ascending:false}).limit(20);
    if(runs.error) throw runs.error;
    if(!runs.data.length){
      box.innerHTML='<div class="card"><div class="eyebrow">Noch keine Simulation</div>'
        +'<p class="muted" style="margin:6px 0 12px">Schreib einen Satz, dann steht er hier.</p>'
        +'<button data-go="klausur">Simulation starten</button></div>';
      box.querySelector('[data-go]').onclick=()=>go('klausur');
      return;
    }
    const ids=runs.data.map(r=>r.run_id);
    const tasks = await sb.from('exam_tasks').select('*').in('run_id', ids).order('position');
    const byRun={}; (tasks.data||[]).forEach(t=>{ (byRun[t.run_id]=byRun[t.run_id]||[]).push(t); });

    // Schwachstellen ueber alle Laeufe
    const kap={};
    (tasks.data||[]).forEach(t=>{
      const k=kap[t.kapitel]=kap[t.kapitel]||{max:0,err:0,n:0};
      k.max+=t.punkte_max; k.err+=t.punkte_erreicht; k.n++;
    });
    const schwach=Object.entries(kap).map(([id,v])=>({id, quote:v.max? v.err/v.max*100:0, n:v.n}))
      .sort((a,b)=>a.quote-b.quote);

    let h='';
    if(schwach.length>1){
      h+='<div class="card"><div class="eyebrow">Punktausbeute je Kapitel, über alle Läufe</div>';
      schwach.forEach(s=>{
        h+='<div class="chrow" style="cursor:default;grid-template-columns:1fr 70px 150px">'
          +'<div class="chname">'+esc(kapName(s.id))+'<br><span class="m">'+s.n+' Aufgabe'+(s.n>1?'n':'')+'</span></div>'
          +'<div class="mono" style="font-size:14px">'+Math.round(s.quote)+' %</div>'
          +'<div>'+sib(s.quote,false)+'</div></div>';
      });
      h+='<div class="muted" style="margin-top:12px">Das oberste Kapitel kostet dich die meisten Punkte.</div></div>';
    }
    runs.data.forEach(r=>{
      const dt=new Date(r.gestartet_am);
      h+='<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:baseline">'
        +'<div><div class="eyebrow">'+dt.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})
        +' · '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})
        +(r.zeit_abgelaufen?' · Zeit abgelaufen':'')+'</div>'
        +'<span class="mono" style="font-size:24px;font-weight:600">'+(r.punkte_erreicht==null?'—':r.punkte_erreicht)
        +'</span><span class="mono" style="color:var(--ink-2)"> / '+r.punkte_max+' P</span></div>'
        +'<div class="mono" style="font-size:17px">'+(r.quote_prozent==null?'':r.quote_prozent+' %')+'</div></div>'
        +'<table class="t" style="margin-top:12px"><tr><th>#</th><th>Aufgabe</th><th>Kapitel</th><th>Punkte</th></tr>'
        +(byRun[r.run_id]||[]).map(t=>'<tr><td class="num">'+t.position+'</td><td>'+esc(t.titel)+'</td>'
          +'<td>'+esc(kapName(t.kapitel))+'</td>'
          +'<td class="num">'+t.punkte_erreicht+' / '+t.punkte_max+'</td></tr>').join('')
        +'</table></div>';
    });
    box.innerHTML=h;
  }catch(e){
    box.innerHTML='<div class="card trap"><div class="eyebrow">Abruf fehlgeschlagen</div>'+esc(String(e.message||e))+'</div>';
  }
}

/* ---------- Klausursimulation ---------- */
let exam=null, examTimer=null;
const PTS={num:2, mc:2, tf:2, offen:6};
function blockArt(a){
  const n=a.steps.filter(s=>s.t==='num').length;
  return (n>=4 && a.kontext) ? 'rechnen' : 'theorie';
}
function blockPts(a){ return a.steps.reduce((s,st)=>s+(PTS[st.t]||2),0); }
function shuffle(x){ return x.slice().sort(()=>Math.random()-0.5); }

function vKlausurStart(){
  return '<div class="pagehead"><div class="eyebrow">Klausursimulation</div><h2>Ein Satz im Format der echten Klausur</h2>'
   +'<div class="sub">Aufgebaut wie der erwartbare Zuschnitt: <b>eine Wahr/Falsch-Aufgabe über alle Kapitel, drei große Rechenaufgaben aus drei verschiedenen Kapiteln, zwei Theorie- oder Fallstudienaufgaben.</b> Punkte werden gezählt, die Zeit richtet sich nach der Punktzahl — ein Punkt, eine Minute, genau wie in der Klausur.</div></div>'
   +'<div class="card"><h3 style="font-size:16px;margin-bottom:8px">Bevor du startest</h3>'
   +'<ul class="muted" style="margin:0 0 16px;padding-left:18px;line-height:1.7">'
   +'<li>Papier und Taschenrechner daneben — die Eingabefelder sind nur die Kontrolle, gerechnet wird auf Papier.</li>'
   +'<li>Während der Bearbeitung gibt es <b>keine Rückmeldung</b>. Erst beim Abgeben wird ausgewertet.</li>'
   +'<li>Bei den offenen Fragen bewertest du dich nach dem Abgeben selbst — anhand der Musterantwort.</li>'
   +'<li>Der Fortschritt aus dem Übungsmodus bleibt unberührt.</li></ul>'
   +'<button id="exstart">Simulation starten</button></div>';
}

function buildExam(){
  const items=[];

  // ── Aufgabe 1: Wahr/Falsch, quer über alle Kapitel ──
  let tfPool=[];
  CH.forEach(c=>c.aufgaben.forEach(a=>a.steps.forEach(s=>{ if(s.t==='tf') tfPool.push({s,c}); })));
  const wf=shuffle(tfPool).slice(0,8);
  items.push({
    c:{id:'mix', titel:'quer über alle Kapitel'},
    a:{titel:'Wahr oder falsch?',
       kontext:'<p>Entscheiden Sie für jede Aussage, ob sie zutrifft. In der echten Klausur streichen Sie bei „falsch" zusätzlich den falschen Teil (höchstens drei Wörter) und tragen die Korrektur ein — <b>beide Teile geben Punkte</b>. Notieren Sie die Korrektur hier auf Papier und gleichen Sie sie beim Auswerten ab.</p>',
       steps:wf.map(x=>x.s)}
  });

  // ── Aufgaben 2-4: drei Rechenaufgaben aus drei verschiedenen Kapiteln ──
  const rech={};
  CH.forEach(c=>c.aufgaben.forEach(a=>{ if(blockArt(a)==='rechnen'){ (rech[c.id]=rech[c.id]||[]).push({c,a}); } }));
  let chPool=[];
  Object.keys(rech).forEach(id=>{
    const c=CH.find(x=>x.id===id);
    const w = c.prio==='A'?3 : c.prio==='B'?2 : 1;   // A-Kapitel häufiger ziehen
    for(let i=0;i<w;i++) chPool.push(id);
  });
  const usedCh=new Set();
  chPool=shuffle(chPool);
  for(const id of chPool){
    if(usedCh.size>=3) break;
    if(usedCh.has(id)) continue;
    usedCh.add(id);
    items.push(shuffle(rech[id])[0]);
  }

  // ── Aufgaben 5-6: zwei Theorie-/Fallstudienaufgaben, möglichst aus anderen Kapiteln ──
  const theo=[];
  CH.forEach(c=>c.aufgaben.forEach(a=>{
    if(blockArt(a)==='theorie' && a.steps.some(s=>s.t!=='tf')) theo.push({c,a});
  }));
  const frisch=shuffle(theo.filter(x=>!usedCh.has(x.c.id)));
  const rest=shuffle(theo.filter(x=>usedCh.has(x.c.id)));
  const theoPick=[];
  const seenT=new Set();
  [...frisch,...rest].forEach(x=>{
    if(theoPick.length>=2 || seenT.has(x.c.id)) return;
    seenT.add(x.c.id); theoPick.push(x);
  });
  items.push(...theoPick);
  return items;
}

function startExam(){
  const items=buildExam();
  const punkte=items.reduce((s,x)=>s+blockPts(x.a),0);
  const minuten=Math.round(punkte);
  exam={items, punkte, minuten, over:false, ans:{}, score:{}, runId:null,
        abgelaufen:false, end:Date.now()+minuten*60000};

  let h='<div class="timer" id="tmr"><span>'+items.length+' Aufgaben · '+punkte+' Punkte</span><span class="t" id="tt">--:--</span></div>';
  items.forEach((x,n)=>{
    h+='<div class="fall"><div class="fall-h"><h3>Aufgabe '+(n+1)+' — '+x.a.titel+'</h3>'
     +'<div class="muted mono" style="font-size:11.5px">'+x.c.titel+' · '+blockPts(x.a)+' Punkte</div></div>';
    if(x.a.kontext) h+='<div class="fall-k prose">'+x.a.kontext+'</div>';
    x.a.steps.forEach((st,si)=>{ h+=stepHTML(x.c.id,n,si,st,'EX'); });
    h+='</div>';
  });
  h+='<div class="card" style="text-align:center"><button id="exdone">Abgeben und auswerten</button>'
   +'<div class="muted" style="margin-top:8px">Danach werden alle Lösungswege und die Punkte sichtbar.</div></div>';
  $('#main').innerHTML=h;
  bind();
  document.getElementById('exdone').onclick=()=>{
    if(confirm('Abgeben? Danach kannst du nichts mehr ändern.')) endExam();
  };
  clearInterval(examTimer); examTimer=setInterval(tick,1000); tick();
}

function tick(){
  const el=document.getElementById('tt'); if(!el||!exam){ clearInterval(examTimer); return; }
  if(exam.over){ clearInterval(examTimer); return; }
  let s=Math.max(0,Math.round((exam.end-Date.now())/1000));
  el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  if(s<600) document.getElementById('tmr').classList.add('low');
  if(s===0){ clearInterval(examTimer); exam.abgelaufen=true; endExam(true); }
}

function endExam(zeitAbgelaufen){
  clearInterval(examTimer);
  exam.over=true;
  document.querySelectorAll('.step').forEach(el=>{
    if(!el.dataset.key.startsWith('EX')) return;
    const {st}=findStep(el), key=el.dataset.key, fb=fbBox(el), max=PTS[st.t]||2;
    const geg=exam.ans[key];
    let p=0, txt='';
    if(st.t==='num'){
      const r = geg==null? 'wrong' : checkNum(parseNum(geg), st.sol, st.tol);
      p = r==='right'? max : r==='close'? Math.round(max/2) : 0;
      txt = '<b>'+p+' / '+max+' P · Lösung: '+fmt(st.sol)+(st.unit?' '+st.unit:'')+'</b>'
          + (geg? '<div class="muted" style="margin-top:3px">Deine Eingabe: '+esc(geg)+'</div>':'<div class="muted" style="margin-top:3px">nicht bearbeitet</div>')
          + '<div class="weg">'+st.weg+'</div>';
    } else if(st.t==='mc'){
      p = geg===st.r? max : 0;
      txt='<b>'+p+' / '+max+' P · Richtig: '+st.opts[st.r]+'</b><div class="weg">'+st.weg+'</div>';
      el.querySelectorAll('[data-opt]').forEach(b=>{
        b.disabled=true;
        if(+b.dataset.opt===st.r) b.classList.add('right');
        else if(+b.dataset.opt===geg) b.classList.add('wrong');
      });
    } else if(st.t==='tf'){
      p = geg===st.r? max : 0;
      txt='<b>'+p+' / '+max+' P · '+(st.r?'Wahr':'Falsch')+'</b><div class="weg">'+st.weg+'</div>';
      el.querySelectorAll('[data-tf]').forEach(b=>b.disabled=true);
    } else {
      txt='<b>Musterantwort ('+max+' P — bewerte dich selbst)</b><div style="margin-top:6px">'+st.muster+'</div>'
        + '<div class="selfgrade" data-sg="'+key+'" data-max="'+max+'">'
        + '<button class="sm ghost" data-p="'+max+'">voll ('+max+')</button>'
        + '<button class="sm ghost" data-p="'+Math.round(max/2)+'">halb ('+Math.round(max/2)+')</button>'
        + '<button class="sm ghost" data-p="0">nicht (0)</button></div>';
    }
    exam.score[key]=p;
    fb.hidden=false; fb.className='fb '+(p===max?'good':p>0?'mid':'bad'); fb.innerHTML=txt;
    if(st.t==='num'){ const i=el.querySelector('[data-in]'); if(i) i.disabled=true; }
  });
  document.querySelectorAll('.selfgrade').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      exam.score[g.dataset.sg]=+b.dataset.p;
      g.querySelectorAll('button').forEach(x=>x.classList.remove('pick'));
      b.classList.add('pick');
      const fb=g.closest('.fb'); fb.className='fb '+(+b.dataset.p===+g.dataset.max?'good':+b.dataset.p>0?'mid':'bad');
      drawExamResult(); syncExamScore();
    });
  });
  // Versuche protokollieren und den Lauf sichern
  exam.items.forEach((x,n)=>x.a.steps.forEach((s,si)=>{
    const key='EX|'+n+'|'+si, max=PTS[s.t]||2, p=exam.score[key]||0;
    const erg = s.t==='offen' ? 'selbst' : (p===max?'richtig' : p>0?'knapp':'falsch');
    logAttempt(x.c.id==='mix'?'k1':x.c.id, n, si, s, exam.ans[key], erg, 'klausur');
  }));
  saveExamRun();
  const btn=document.getElementById('exdone');
  if(btn){ btn.textContent='Neue Simulation'; btn.onclick=()=>go('klausur'); }
  const t=document.getElementById('tmr');
  if(t) t.innerHTML='<span>Ausgewertet'+(zeitAbgelaufen?' · Zeit abgelaufen':'')+'</span><span class="t">✓</span>';
  drawExamResult();
  window.scrollTo(0,0);
}

async function saveExamRun(){
  if(!online || !exam) return;
  try{
    const erreicht = Object.values(exam.score).reduce((a,b)=>a+b,0);
    const r = await sb.from('exam_runs').insert({
      user_id: uid, minuten: exam.minuten, punkte_max: exam.punkte,
      punkte_erreicht: erreicht, beendet_am: new Date().toISOString(),
      zeit_abgelaufen: !!exam.abgelaufen
    }).select('id').single();
    if(r.error) throw r.error;
    exam.runId = r.data.id;
    const rows = exam.items.map((x,n)=>{
      let p=0; x.a.steps.forEach((s,si)=>{ p += exam.score['EX|'+n+'|'+si]||0; });
      return { run_id: exam.runId, user_id: uid, position: n+1,
               kapitel: x.c.id, titel: x.a.titel.slice(0,120),
               punkte_max: blockPts(x.a), punkte_erreicht: p };
    });
    const t = await sb.from('exam_tasks').insert(rows);
    if(t.error) throw t.error;
  }catch(e){ console.warn('Klausurlauf nicht gespeichert:', e); }
}

async function syncExamScore(){
  if(!online || !exam || !exam.runId) return;
  try{
    const erreicht = Object.values(exam.score).reduce((a,b)=>a+b,0);
    await sb.from('exam_runs').update({ punkte_erreicht: erreicht }).eq('id', exam.runId);
    for(let n=0; n<exam.items.length; n++){
      let p=0; exam.items[n].a.steps.forEach((s,si)=>{ p += exam.score['EX|'+n+'|'+si]||0; });
      await sb.from('exam_tasks').update({ punkte_erreicht: p })
        .eq('run_id', exam.runId).eq('position', n+1);
    }
  }catch(e){ console.warn('Punkte nicht aktualisiert:', e); }
}

function drawExamResult(){
  const erreicht=Object.values(exam.score).reduce((a,b)=>a+b,0);
  const quote=exam.punkte? erreicht/exam.punkte*100 : 0;
  const offenOffen=exam.items.some((x,n)=>x.a.steps.some((s,si)=>s.t==='offen' && exam.score['EX|'+n+'|'+si]===0 && !document.querySelector('[data-sg="EX|'+n+'|'+si+'"] .pick')));
  let rows='';
  exam.items.forEach((x,n)=>{
    const max=blockPts(x.a);
    let p=0; x.a.steps.forEach((s,si)=>{ p+=exam.score['EX|'+n+'|'+si]||0; });
    rows+='<div class="chrow" style="cursor:default;grid-template-columns:1fr 90px 150px">'
      +'<div class="chname">Aufgabe '+(n+1)+' — '+x.a.titel+'<br><span class="m">'+x.c.titel+'</span></div>'
      +'<div class="mono" style="font-size:14px">'+p+' / '+max+'</div>'
      +'<div>'+sib(max? p/max*100:0, false)+'</div></div>';
  });
  let card=document.getElementById('exres');
  if(!card){
    card=document.createElement('div'); card.id='exres'; card.className='card';
    $('#main').insertBefore(card, $('#main').children[1]);
  }
  card.innerHTML='<div class="eyebrow">Auswertung</div>'
   +'<div style="display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin:6px 0 16px">'
   +'<div><span class="mono" style="font-size:34px;font-weight:600">'+erreicht+'</span><span class="mono" style="font-size:18px;color:var(--ink-2)"> / '+exam.punkte+' P</span>'
   +'<div class="muted">'+Math.round(quote)+' % — '+(quote>=90?'sehr gut':quote>=75?'gut':quote>=60?'befriedigend':quote>=50?'ausreichend':'noch nicht bestanden')+'</div></div>'
   +'</div>'
   + (offenOffen? '<div class="hint" style="margin-top:0"><div class="eyebrow">Noch offen</div>Die offenen Fragen sind erst bewertet, wenn du dir unten Punkte gegeben hast. Bis dahin zählen sie mit 0.</div>':'')
   + rows
   + '<div class="muted" style="margin-top:14px">Die 50-%-Grenze ist eine Faustregel, keine offizielle Notenskala. Aussagekräftiger als die Prozentzahl ist, <b>in welcher Aufgabe</b> die Punkte fehlen.</div>';
}

/* ============================================================
   INTERAKTION
   ============================================================ */
function findStep(el){
  const chId=el.dataset.ch, ai=+el.dataset.ai, si=+el.dataset.si;
  const c=CH.find(x=>x.id===chId);
  if(el.dataset.key.startsWith('EX')){
    const it=exam.items[ai]; return {c:it.c, st:it.a.steps[si]};
  }
  return {c, st:c.aufgaben[ai].steps[si]};
}
function fbBox(el){ return el.querySelector('[data-fb]'); }
function markDone(el){
  el.classList.add('ok');
  if(!el.dataset.key.startsWith('EX')){ P.done[el.dataset.key]=true; save(); drawRail(); }
}
function revealStep(el,forced){
  const {st}=findStep(el), fb=fbBox(el);
  let body='';
  if(st.t==='offen') body='<b>Musterantwort</b><div style="margin-top:6px">'+st.muster+'</div>';
  else if(st.t==='num') body='<b>Lösung: '+fmt(st.sol)+(st.unit?' '+st.unit:'')+'</b><div class="weg">'+st.weg+'</div>';
  else if(st.t==='mc') body='<b>Richtig: '+st.opts[st.r]+'</b><div class="weg">'+st.weg+'</div>';
  else body='<b>'+(st.r?'Wahr':'Falsch')+'</b><div class="weg">'+st.weg+'</div>';
  fb.className='fb '+(forced?'good':'good'); fb.hidden=false; fb.innerHTML=body;
  if(st.t==='mc'){
    el.querySelectorAll('[data-opt]').forEach(b=>{ if(+b.dataset.opt===st.r) b.classList.add('right'); });
  }
}
function bind(){
  drawDeck();
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{ view.tab=e.dataset.tab; render(); });
  document.querySelectorAll('[data-tab]').forEach(e=>e.onkeydown=ev=>{ if(ev.key==='Enter'){ev.preventDefault();e.click();} });
  document.querySelectorAll('#main [data-ch]').forEach(e=>{ if(e.classList.contains('chrow')||e.tagName==='BUTTON') e.onclick=()=>go('ch',e.dataset.ch); });
  document.querySelectorAll('#main [data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));

  const st0=document.getElementById('exstart'); if(st0) st0.onclick=startExam;

  const fs=document.getElementById('fsearch');
  if(fs){
    const run=()=>{ const q=fs.value.trim().toLowerCase();
      document.querySelectorAll('.fblock').forEach(b=>{ b.style.display = !q || b.dataset.txt.includes(q) ? '' : 'none'; }); };
    fs.oninput=run;
    document.getElementById('fclear').onclick=()=>{ fs.value=''; run(); };
  }

  document.querySelectorAll('.step').forEach(el=>{
    const {st}=findStep(el);
    const key=el.dataset.key;
    const live = key.startsWith('EX') && exam && !exam.over;
    if(live){
      const inp=el.querySelector('[data-in]');
      if(inp) inp.oninput=()=>{ exam.ans[key]=inp.value; };
      const ta=el.querySelector('textarea');
      if(ta) ta.oninput=()=>{ exam.ans[key]=ta.value; };
      el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
        exam.ans[key]=+b.dataset.opt;
        el.querySelectorAll('[data-opt]').forEach(x=>x.classList.remove('pick'));
        b.classList.add('pick');
      });
      el.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{
        exam.ans[key]=b.dataset.tf==='1';
        el.querySelectorAll('[data-tf]').forEach(x=>{ x.classList.add('ghost'); x.classList.remove('pick'); });
        b.classList.remove('ghost'); b.classList.add('pick');
      });
      return;
    }
    const rv=el.querySelector('[data-reveal]');
    if(rv) rv.onclick=()=>{ revealStep(el); if(st.t==='offen') markDone(el); };
    const mk=el.querySelector('[data-mark]');
    if(mk) mk.onclick=()=>{
      markDone(el); mk.textContent='✓ Sitzt';
      const ta=el.querySelector('textarea');
      logAttempt(el.dataset.ch, el.dataset.ai, el.dataset.si, st, ta?ta.value:null, 'selbst', 'uebung');
    };

    const chk=el.querySelector('[data-check]');
    if(chk){
      const inp=el.querySelector('[data-in]');
      const run=()=>{
        const r=checkNum(parseNum(inp.value), st.sol, st.tol), fb=fbBox(el);
        fb.hidden=false;
        if(r==='right'){ fb.className='fb good'; fb.innerHTML='<b>Richtig.</b><div class="weg">'+st.weg+'</div>'; markDone(el); }
        else if(r==='close'){ fb.className='fb mid'; fb.innerHTML='<b>Knapp daneben — sieht nach einem Rundungs- oder Vorzeichenfehler aus.</b> Rechne nochmal nach.'; }
        else { fb.className='fb bad'; fb.innerHTML='<b>Noch nicht.</b> Versuch es erneut oder öffne den Lösungsweg.'; }
        logAttempt(el.dataset.ch, el.dataset.ai, el.dataset.si, st, inp.value,
                   r==='right'?'richtig':r==='close'?'knapp':'falsch', 'uebung');
      };
      chk.onclick=run;
      inp.onkeydown=e=>{ if(e.key==='Enter') run(); };
    }
    el.querySelectorAll('[data-opt]').forEach(b=>{
      b.onclick=()=>{
        const i=+b.dataset.opt, fb=fbBox(el);
        el.querySelectorAll('[data-opt]').forEach(x=>x.classList.remove('pick','right','wrong'));
        fb.hidden=false;
        if(i===st.r){ b.classList.add('right'); fb.className='fb good'; fb.innerHTML='<b>Richtig.</b><div class="weg">'+st.weg+'</div>'; markDone(el); }
        else { b.classList.add('wrong'); el.querySelector('[data-opt="'+st.r+'"]').classList.add('right');
               fb.className='fb bad'; fb.innerHTML='<b>Nicht ganz.</b><div class="weg">'+st.weg+'</div>'; }
        logAttempt(el.dataset.ch, el.dataset.ai, el.dataset.si, st,
                   st.opts[i], i===st.r?'richtig':'falsch', 'uebung');
      };
    });
    el.querySelectorAll('[data-tf]').forEach(b=>{
      b.onclick=()=>{
        const v=b.dataset.tf==='1', fb=fbBox(el);
        fb.hidden=false;
        if(v===st.r){ fb.className='fb good'; fb.innerHTML='<b>Richtig.</b><div class="weg">'+st.weg+'</div>'; markDone(el); }
        else { fb.className='fb bad'; fb.innerHTML='<b>Nicht ganz.</b><div class="weg">'+st.weg+'</div>'; }
        logAttempt(el.dataset.ch, el.dataset.ai, el.dataset.si, st,
                   v?'Wahr':'Falsch', v===st.r?'richtig':'falsch', 'uebung');
      };
    });
  });
}

/* ---------- Start ---------- */
(async()=>{
  await load(); drawRail(); render();
  await initBackend();
  drawRail();
  if(online){ await pullAll(); drawRail(); render(); }
  else drawRail();
})();
</script>
