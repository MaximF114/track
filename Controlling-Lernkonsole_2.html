<style>

  --paper:#E3E8EA; --card:#FAFBFB; --card-2:#F1F4F5;

  --plan:#1D4E6B;      /* PLAN / SOLL */
  --ist:#9E3324;       /* IST / Abweichung */
  --ok:#1B6B4E; --warn:#9A7212;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--rule-2) 1px,transparent 1px),linear-gradient(90deg,var(--rule-2) 1px,transparent 1px);

}

a{color:var(--plan)}
.mono{font-family:var(--mono)}

/* ---------- Shell ---------- */
.shell{display:flex; min-height:100vh; align-items:flex-start}
.rail{

}
.main{flex:1; min-width:0; padding:26px 30px 90px; max-width:1080px}

.brand{padding:0 18px 16px; border-bottom:1px solid var(--rule); margin-bottom:12px}
.brand .kurs{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.brand h1{font-size:20px; margin-top:3px; letter-spacing:-.01em}
.countdown{margin-top:11px; display:flex; align-items:baseline; gap:7px}
.countdown b{font-family:var(--mono); font-size:26px; font-weight:600; color:var(--ist); line-height:1}
.countdown span{font-size:11.5px; color:var(--ink-2)}

.sync{display:flex;align-items:center;gap:6px;margin-top:11px;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:0 0 6px}
.sync.on .dot{background:var(--ok)}
.sync.on{color:var(--ok)}
.sync.off .dot{background:var(--warn)}

.sortbtn{background:none;border:none;color:var(--plan);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 0;text-decoration:underline;flex:0 0 auto}
.sortbtn:hover{color:var(--ist);opacity:1}
.navitem{
  display:flex; align-items:center; gap:9px; padding:7px 18px; cursor:pointer;

}
.navitem:hover{background:var(--card-2); color:var(--ink)}
.navitem.on{border-left-color:var(--plan); background:var(--card-2); color:var(--ink); font-weight:600}
.navitem .nr{font-family:var(--mono); font-size:11px; color:var(--ink-3); width:16px; flex:0 0 16px}

.prio{font-family:var(--mono); font-size:9.5px; font-weight:600; width:15px; height:15px; flex:0 0 15px;

.prio.A{background:var(--ist)} .prio.B{background:var(--warn)} .prio.C{background:var(--ink-3)}

/* ---------- Signature: Soll-Ist-Balken ---------- */
.sib{position:relative; height:22px; background:var(--card-2); border:1px solid var(--rule); overflow:hidden}
.sib .ist{position:absolute; inset:0 auto 0 0; background:var(--plan); transition:width .45s cubic-bezier(.2,.7,.3,1)}
.sib.neg .ist{background:var(--ist)}
.sib .soll{position:absolute; top:-2px; bottom:-2px; width:0; border-left:2px dashed var(--ink); z-index:2}
.sib .soll::after{content:'SOLL'; position:absolute; top:-15px; left:3px; font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; color:var(--ink)}
.sib .lbl{position:absolute; right:7px; top:0; bottom:0; display:flex; align-items:center;
  font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-2); z-index:3}

.card{background:var(--card); border:1px solid var(--rule); padding:20px 22px; margin-bottom:16px}
.card.flat{padding:0; overflow:hidden}
.eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}

.tabs{display:flex; gap:0; border-bottom:1px solid var(--rule); margin-bottom:20px; overflow-x:auto}

.prose ul{margin:0 0 12px; padding-left:19px; max-width:70ch}
.prose li{margin-bottom:5px}
.prose b,.prose strong{font-weight:600}
.k{background:#DCE7EC; padding:0 4px; border-radius:2px; font-weight:600; white-space:nowrap}
.kr{background:#F0DCD8; padding:0 4px; border-radius:2px; font-weight:600; white-space:nowrap}

table.t{border-collapse:collapse; width:100%; margin:6px 0 16px; font-size:13.4px}
table.t th{background:var(--ink); color:#fff; font-weight:600; text-align:left; padding:7px 10px; font-size:11.5px;
  letter-spacing:.05em; text-transform:uppercase; font-family:var(--mono)}
table.t td{border-bottom:1px solid var(--rule-2); padding:7px 10px; vertical-align:top}
table.t tr:nth-child(even) td{background:var(--card-2)}

pre.f{background:var(--ink); color:#DCE7EC; font-family:var(--mono); font-size:12.8px; line-height:1.75;

button{font-family:inherit; font-size:13.5px; cursor:pointer; border:1px solid var(--ink); background:var(--ink);

button:hover{opacity:.86}
button.ghost{background:transparent; color:var(--ink)}
button.ghost:hover{background:var(--card-2); opacity:1}
button.sm{padding:4px 10px; font-size:12.5px}
button:focus-visible,input:focus-visible,.tab:focus-visible,.navitem:focus-visible{outline:2px solid var(--ist); outline-offset:2px}
input[type=text],input[type=number],textarea{
  font-family:var(--mono); font-size:14px; padding:7px 10px; border:1px solid var(--rule);

.answer .unit{font-family:var(--mono); font-size:13px; color:var(--ink-2)}
.answer input{max-width:190px}
.fb{margin-left:30px; margin-top:9px; font-size:13.6px; padding:9px 12px; border-left:3px solid}
.fb.good{border-color:var(--ok); background:#E9F3EE}
.fb.bad{border-color:var(--ist); background:#FBEEEB}
.fb.mid{border-color:var(--warn); background:#FAF5E6}
.selfgrade{display:flex; gap:7px; flex-wrap:wrap; margin-top:11px}

.opt.wrong{border-color:var(--ist); border-width:2px; background:#FBEEEB}

.kbar{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap}

/* ---------- Dashboard ---------- */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
.stat{background:var(--card); border:1px solid var(--rule); padding:16px 18px}
.stat .v{font-family:var(--mono); font-size:32px; font-weight:600; line-height:1; letter-spacing:-.02em}
.stat .l{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.chrow{display:grid; grid-template-columns:26px 1fr 150px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--rule-2); cursor:pointer}
.chrow:hover .chname{color:var(--plan)}
.chname{font-size:14px}
.chname .m{font-size:11.5px; color:var(--ink-3); font-family:var(--mono)}

/* ---------- Klausur ---------- */
.timer{position:sticky; top:0; z-index:20; background:var(--ink); color:#fff; padding:9px 16px;
  display:flex; align-items:center; justify-content:space-between; margin:-26px -30px 20px; font-family:var(--mono)}
.timer .t{font-size:22px; font-weight:600}
.timer.low .t{color:#FFB4A0}

/* ---------- Suche ---------- */
.search{display:flex; gap:8px; margin-bottom:18px}
.search input{flex:1}
mark{background:#F5DFA8; color:inherit; padding:0 1px}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

const CH = [
/* ══════════════ K1 GRUNDLAGEN ══════════════ */
{
id:'k1', nr:'01', titel:'Einführung & Grundlagen', prio:'C', kurz:'Begriffe, Aufgaben, operativ vs. strategisch — die Munition für die Wahr/Falsch-Aufgabe.',
stoff:`
<h3>Controlling ist Steuerung, nicht Kontrolle</h3>
<p>Der Begriff kommt von <i>to control</i> = steuern, regeln. <span class="k">Controlling</span> ist die <b>Funktion</b>, der <span class="k">Controller</span> ist der <b>Stelleninhaber</b>. Diese Unterscheidung ist eine klassische Wahr/Falsch-Zeile.</p>
<p>Controlling <b>bereitet Entscheidungen vor</b> und trifft sie nicht: <span class="k">decision facilitating</span> (Informationsversorgung) und <span class="k">decision influencing</span> (Verhaltenssteuerung über Ziele und Anreize).</p>

<h3>Die Definition — wörtlich lernen</h3>
<p>Berens/Knauer/Sommer/Wöhrmann 2013:</p>
<div class="hint"><div class="eyebrow">Definition der Vorlesung</div>„Controlling dient der <b>Beschaffung, Aufbereitung, Analyse und Kommunikation von Daten</b> zur <b>Vorbereitung zielsetzungsgerechter eigener sowie fremder Entscheidungen</b>."</div>
<p>Die vier Verben und die zwei Entscheidungsarten sind der Kern. <b>Eigene</b> Entscheidungen vorbereiten = <span class="k">decision facilitating</span>. <b>Fremde</b> Entscheidungen beeinflussen = <span class="k">decision influencing</span>.</p>
<p>Controlling kann <i>auch</i> durch Controller erfüllt werden — aber nicht nur. In kleinen Unternehmen macht es die Geschäftsführung: <b>Controlling ohne Controller ist möglich.</b></p>

<h3>Pilot und Co-Pilot</h3>
<p>Der Controller ist <b>serviceverantwortlich</b> für vier Transparenzen — <b>Ergebnis-, Finanz-, Prozess- und Strategietransparenz</b>. Die <b>Ergebnisverantwortung</b> trägt der Manager. Bild: Der Manager fliegt, der Controller liest die Instrumente.</p>

<h3>Fünf Elemente, die alle Controlling-Ansätze teilen</h3>
<ul>
<li>Zielorientierung (ohne Ziel keine Steuerung)</li>
<li>Informationsversorgung und -aufbereitung</li>
<li>Koordination von Planung und Kontrolle</li>
<li>Unterstützung, nicht Ersatz der Führung</li>
<li>Zukunftsbezug statt reiner Vergangenheitsrechnung</li>
</ul>

<h3>Effizienz vs. Effektivität</h3>
<table class="t"><tr><th>Begriff</th><th>Frage</th><th>Formel/Idee</th></tr>
<tr><td><b>Effizienz</b></td><td>Die Dinge <b>richtig</b> tun</td><td>Ergebnis / Mitteleinsatz</td></tr>
<tr><td><b>Effektivität</b></td><td>Die <b>richtigen</b> Dinge tun</td><td>Zielerreichungsgrad</td></tr></table>

<h3>Operativ vs. strategisch</h3>
<table class="t"><tr><th></th><th>Operativ</th><th>Strategisch</th></tr>
<tr><td>Zielgröße</td><td>Gewinn, Liquidität, Wirtschaftlichkeit</td><td><b>Erfolgspotenziale</b></td></tr>
<tr><td>Blickrichtung</td><td>vorwiegend <b>intern</b></td><td>intern <b>und extern</b></td></tr>
<tr><td>Daten</td><td>quantitativ, relativ sicher</td><td>qualitativ, unsicher</td></tr>
<tr><td>Horizont</td><td>1 Jahr (Budget), taktisch 3–5 J.</td><td>ca. 10 Jahre</td></tr>
<tr><td>Instrumente</td><td>Budget, Abweichungsanalyse, Kennzahlen, PKR, Kalkulation</td><td>SWOT, PESTEL, Portfolio, GAP, Branchenstrukturanalyse, Target Costing</td></tr></table>
<div class="trap"><div class="eyebrow">Falle</div>Strategische Instrumente unterstützen primär die <b>Wahrnehmung</b> von Chancen und Risiken — nicht die exakte Bewertung.</div>

<h3>Krisenverlauf und Planungsebenen</h3>
<p>Die Reihenfolge ist prüfungsrelevant: <span class="kr">strategische Krise → Erfolgskrise → Liquiditätskrise</span>. Wer erst bei der Liquidität merkt, dass etwas nicht stimmt, hat zwei Frühwarnstufen verpasst.</p>
<p><b>Vision → Leitbild → Strategie → Ziele.</b> Das <b>Leitbild präzisiert die Vision</b> (nicht umgekehrt). Ziele nach <span class="k">SMART</span>: <b>s</b>pezifisch, <b>m</b>essbar, <b>a</b>nspruchsvoll, <b>r</b>elevant, <b>t</b>erminiert.</p>

<h3>Instrumentenlandkarte (strategisch)</h3>
<table class="t"><tr><th>Instrument</th><th>Richtung</th><th>Leistet</th></tr>
<tr><td>PESTEL</td><td>extern, Makro</td><td>Umfeldfaktoren: politisch, ökonomisch, sozial, technologisch, ökologisch, legal</td></tr>
<tr><td>Branchenstrukturanalyse (Porter)</td><td>extern, Mikro</td><td>Fünf Wettbewerbskräfte</td></tr>

<h3>IT-Controller</h3>
<p>Dieselbe Definition, angewandt auf „<b>Anschaffung, Realisierung, Betrieb und Abgang von Hard- und Software</b>". Englische Bezeichnung: <b>IT Performance Management</b>.</p>
<p>Schnittstellenrolle: fachliches Controlling-Wissen + IT-Verständnis. Steuert IT-Kosten und IT-Leistungen, betreibt Systeme wie Data Warehouse und BI und liefert die Datenbasis für alle anderen Instrumente. Typische Instrumente: <b>TCO</b>, IT-Kennzahlen, IT-Portfolio, Verrechnung von IT-Leistungen.</p>

<h3>Zahlen zum IT-Controlling</h3>
<p>Organisatorische Einordnung in der Praxis: rund <b>50 % dem CIO</b> unterstellt, nur etwa <b>10 % direkt der Geschäftsführung</b>. Klassische Wahr/Falsch-Falle.</p>

<h3>Rechnungswesen — die Zuordnung</h3>
<p><b>Internes</b> Rechnungswesen: Kosten- und Leistungsrechnung, freie Gestaltung, Steuerungszweck. <b>Externes</b>: Finanzbuchhaltung/Jahresabschluss nach HGB/IFRS, gesetzlich normiert, Rechenschaft gegenüber Dritten. Die <b>Finanzbuchhaltung liefert die Daten fürs externe</b> Rechnungswesen — die Kostenrechnung ist intern.</p>

id:'k2', nr:'02', titel:'Operative Planung & Abweichungsanalyse', prio:'A', kurz:'Das Vier-Spalten-Schema, Beschäftigungsabweichung, das Diagramm und die Budgetierung.',
stoff:`
<h3>Das Herzstück: vier Spalten</h3>
<p>Jede Kostengröße hat drei Determinanten — <b>Preis</b>, <b>Verbrauch</b> (Input je Outputeinheit) und <b>Volumen</b> (Beschäftigung). Die vier Spalten entstehen, indem von links nach rechts jeweils eine Determinante von PLAN auf IST umgestellt wird. Die Differenz zweier Nachbarspalten <b>ist</b> die jeweilige Abweichung.</p>
<table class="t"><tr><th>Determinante</th><th>Plankosten</th><th>Sollkosten</th><th>Ist zu Planpreisen</th><th>Ist zu Istpreisen</th></tr>
<tr><td>Preis</td><td>PLAN</td><td>PLAN</td><td>PLAN</td><td class="kr">IST</td></tr>
<tr><td>× Verbrauch</td><td>PLAN</td><td>PLAN</td><td class="kr">IST</td><td class="kr">IST</td></tr>
<tr><td>× Volumen</td><td>PLAN</td><td class="kr">IST</td><td class="kr">IST</td><td class="kr">IST</td></tr></table>
<pre class="f"><b>Volumenabweichung</b>     = Sollkosten           − Plankosten
<b>Verbrauchsabweichung</b>  = Ist zu Planpreisen   − Sollkosten
<b>Preisabweichung</b>       = Ist zu Istpreisen    − Ist zu Planpreisen

Probe: Volumen + Verbrauch + Preis = Istkosten − Plankosten</pre>
<div class="hint"><div class="eyebrow">Merke</div>Die <b>Fixkosten</b> vor der Rechnung herausziehen. Volumen-, Verbrauchs- und Preisabweichung werden nur auf den <b>variablen</b> Kosten ermittelt.</div>

<h3>Beschäftigungsabweichung — nur auf Vollkostenbasis</h3>
<pre class="f">k_P   = K_Plan / x_Plan                   (Plankostenverrechnungssatz, VOLLkosten)
K_ver = k_P · x_ist                       (verrechnete Plankosten = <b>Ursprungsgerade</b>)
K_Soll(voll) = K_fix + k_var · x_ist

<b>Beschäftigungsabweichung = K_Soll(voll) − K_ver = K_fix · (1 − x_ist/x_Plan)</b>   = Leerkosten
Nutzkosten = K_fix · x_ist / x_Plan</pre>
<p>Bei <b>Unter</b>auslastung ist sie positiv (Leerkosten, Unterdeckung), bei <b>Über</b>auslastung negativ (Überdeckung). Auf <b>Teilkosten</b>basis gibt es sie nicht: dort sind Sollkosten und verrechnete Plankosten identisch.</p>

<h3>Warum die Reihenfolge zählt</h3>
<p>Weichen mehrere Determinanten gleichzeitig ab, entsteht ein Kombinationseffekt <span class="k">Δp · Δx</span> — eine <b>Abweichung höherer Ordnung</b>. Bei der <b>kumulativen</b> Analyse wird er der <b>zuerst berechneten</b> Abweichung zugeschlagen, bei der <b>differenzierten</b> separat ausgewiesen.</p>
<p><b>Regel:</b> Die für die Kostenkontrolle <i>weniger</i> aussagefähige Abweichung wird zuerst berechnet — sie trägt die Sekundärabweichung, damit die wichtigere sauber bleibt. Deshalb wird die Verbrauchsabweichung immer zu <b>Plan</b>preisen ermittelt: Der Kostenstellenleiter soll nicht für Einkaufspreise haften.</p>
<pre class="f">Differenziert:  PA = Δp · x_Plan   ·   MA = Δx · p_Plan   ·   <b>Sekundär = Δp · Δx</b></pre>

<h3>Verantwortlichkeiten</h3>
<table class="t"><tr><th>Abweichung</th><th>Verantwortlich</th></tr>
<tr><td>Preisabweichung</td><td>Einkauf / Beschaffung</td></tr>
<tr><td>Verbrauchsabweichung</td><td>Kostenstellenleiter (Fertigung)</td></tr>
<tr><td>Volumen-/Beschäftigungsabweichung</td><td>Absatz / Unternehmensleitung</td></tr></table>

<h3>Das Diagramm — 5 Punkte, unbedingt üben</h3>
<p>Achsen: x = Beschäftigung, y = Kosten. Zwei Senkrechte bei x_ist und x_Plan.</p>
<table class="t"><tr><th>Linie</th><th>Verlauf</th></tr>
<tr><td>Fixkostengerade</td><td>waagerecht bei K_fix</td></tr>
<tr><td><b>Sollkostengerade</b></td><td>K_S(x) = K_fix + k_var·x — Ordinatenabschnitt K_fix, trifft bei x_Plan den Plankostenpunkt</td></tr>
<tr><td><b>Verrechnete Plankosten</b></td><td>K_ver(x) = k_P·x — <b>Ursprungsgerade</b>, schneidet die Sollkostengerade genau im Plankostenpunkt</td></tr>
<tr><td>Istkosten</td><td>zwei Punkte über x_ist: zu Planpreisen und zu Istpreisen</td></tr></table>
<p>Über x_ist von unten nach oben abgetragen: <b>K_ver → Beschäftigungsabw. → Verbrauchsabw. → Preisabw.</b></p>
<div class="trap"><div class="eyebrow">Falle</div>Die <b>Volumenabweichung</b> liegt als einzige <b>nicht</b> über x_ist. Sie ist die Bewegung <i>entlang</i> der Sollkostengeraden vom Plankostenpunkt zum Sollkostenpunkt.</div>

<h3>Wo die operative Planung ansetzt</h3>
<p>Die <b>strategische Planung</b> liefert Ziele und Maßnahmen. Die <b>operative Planung</b> übersetzt sie in <b>Budgets</b> und ein <b>Anreizsystem</b>; die Umsetzung erzeugt Ist-Werte, der <b>Soll-Ist-Vergleich</b> deckt <b>interne und externe Abweichungen</b> auf, daraus folgt die <b>Gegensteuerung</b>. Die Abweichungsanalyse ist also nicht Selbstzweck, sondern das Rückkopplungsglied dieses Regelkreises.</p>
<p>Die Gesamtplanung zerfällt in zwei Äste:</p>
<table class="t"><tr><th>Sachzielplanung</th><th>Formalzielplanung</th></tr>
<tr><td>Absatz-, Fertigungsprogramm- und Fertigungsablaufplanung, Beschaffung und Bereitstellung, Personal-, Material-, Lagerplanung — <b>Mengen</b></td><td>Erlös-, Kosten-, Erfolgs-, Ein- und Auszahlungs-, Liquiditätsplanung — <b>Werte</b></td></tr></table>
<p><b>Budgetierung ist Formalzielplanung:</b> die Festlegung des <b>wertmäßigen Rahmens des Wirtschaftens</b>.</p>

<h3>Budgetierung</h3>
<p>Ein <span class="k">Budget</span> ist ein in <b>Wertgrößen</b> formulierter Plan, der einer <b>Entscheidungseinheit</b> für eine <b>bestimmte Periode</b> mit einem <b>bestimmten Verbindlichkeitsgrad</b> vorgegeben wird.</p>
<table class="t"><tr><th>Planungsfunktionen</th><th>Verhaltenssteuerungsfunktionen</th></tr>
<tr><td>Koordination · Kontrolle · Vorgabe · Allokation</td><td>Beurteilung · Motivation</td></tr></table>
<p><b>Vorteile der Budgetierung:</b> Zwang zur <b>Quantifizierung von Zielen</b> · <b>Bewilligungs- und Allokationsfunktion</b> · <b>Frühwarnsystem</b> durch Analyse der Plan-Ist-Abweichungen · <b>Motivationsfunktion</b> durch Verknüpfung mit der Vergütung.</p>

<h3>Das Budget-Handbuch</h3>
<p>Vor allem für mittlere bis große, international tätige Unternehmen. In der Regel kein Buch im engeren Sinn, sondern eine <b>Sammlung von Einzelanweisungen</b>. Zentrale Aufgabe: <b>Informationsinstrument</b> — es schafft eine <b>einheitliche Vorgehensweise</b> und damit die <b>Vergleichbarkeit von Werten und Abweichungen</b>.</p>
<table class="t"><tr><th>Allgemeiner Teil</th><th>Spezieller Teil</th></tr>
<tr><td>1 Zweck und Zielsetzung · 2 Zweck der Budgetkontrolle · 3 Allgemeine Planungs- und Kontrollgrundsätze · 4 Verantwortungsbereiche · 5 Termine im Planungsprozess</td><td>1 Regelungen der Kostenplanung · 2 Organisation der Budgetaufstellung · 3 Verzeichnis der Formblätter · 4 Kostenkontrolle</td></tr></table>
<p><b>Prinzipal-Agenten-Problem:</b> Hängt die Entlohnung am Budget, hat der Budgetnehmer den Anreiz, <b>nicht wahrheitsgemäß zu berichten</b> — Ertragspotenziale untertreiben, Kosten übertreiben. Ergebnis: <span class="kr">Budget Slack</span>, ein Überschuss an Ressourcen über den tatsächlichen Bedarf hinaus. Ursache ist die <b>Überfrachtung des Budgets mit Prognose- und Motivationsfunktion zugleich</b>.</p>
<p><b>Fortschreibungsbudgetierung:</b> Vorperiodenwerte plus pauschaler Zu-/Abschlag — keine echte Planung, schreibt Unwirtschaftlichkeiten fort. <b>Alternativen:</b> Better/Advanced Budgeting, Zero Base Budgeting, Beyond Budgeting, Rolling Forecast, Activity Based Budgeting.</p>
`,

id:'k3', nr:'03', titel:'Kennzahlen & Kennzahlensysteme', prio:'B', kurz:'Rentabilitäten, EBIT-Familie, Cashflow, Liquidität — hohe Punktdichte bei wenig Lernaufwand.',
stoff:`
<h3>Rentabilitätskennzahlen</h3>
<pre class="f">Gesamtkapitalrentabilität VOR Steuern = EBIT / Bilanzsumme
Gesamtkapitalrent. NACH Steuern       = (JÜ + FK-Zinsen) / GK   bzw. NOPAT / GK
Eigenkapitalrentabilität (ROE)        = Jahresüberschuss / Eigenkapital
Umsatzrentabilität (ROS)              = Jahresüberschuss / Umsatz
EBIT-Marge                            = EBIT / Umsatz

<b>ROI  = (Gewinn/Umsatz) × (Umsatz/investiertes Kapital)
     = Umsatzrentabilität × Kapitalumschlag</b>
ROCE = EBIT / Capital Employed        (CE = EK + verzinsliches FK)</pre>
<div class="trap"><div class="eyebrow">Falle</div>„<b>vor Steuern</b>" bedeutet <b>EBIT</b> im Zähler — nicht JÜ + Zinsen. Letzteres ist die Nach-Steuer-Größe.</div>

<h3>Die EBIT-Familie — von unten nach oben</h3>
<pre class="f">EBT    = JÜ + Steueraufwand
EBIT   = JÜ + Steuern + Zinsaufwand − Zinsertrag
EBITDA = EBIT + Abschreibungen (Sachanlagen + immaterielle)
NOPAT  = EBIT · (1 − s)</pre>
<p><b>Englische Langformen werden explizit abgefragt:</b></p>
<table class="t"><tr><th>Kürzel</th><th>Langform</th></tr>
<tr><td>EBIT</td><td>Earnings Before Interest and Taxes</td></tr>
<tr><td>EBITDA</td><td>Earnings Before Interest, Taxes, Depreciation and Amortization</td></tr>
<tr><td>EBT</td><td>Earnings Before Taxes</td></tr>
<tr><td>NOPAT</td><td>Net Operating Profit After Taxes</td></tr>
<tr><td>ROI / ROCE</td><td>Return on Investment / Return on Capital Employed</td></tr>
<tr><td>ROE / ROS</td><td>Return on Equity / Return on Sales</td></tr>
<tr><td>KPI / WACC</td><td>Key Performance Indicator / Weighted Average Cost of Capital</td></tr></table>
<p><b>Depreciation</b> = Abschreibung auf <b>materielle</b>, <b>Amortization</b> = auf <b>immaterielle</b> Vermögenswerte.</p>

<h3>Cashflow (indirekte Ermittlung)</h3>
<pre class="f">Jahresüberschuss
+ Abschreibungen            − Zuschreibungen
+ Zuführung Rückstellungen  − Inanspruchnahme Rückstellungen
± sonstige zahlungsunwirksame Posten
− Erträge aus Anlagenabgängen
= <b>Cashflow</b>

Kontrolle: liq. Mittel Ende − Anfang = CF operativ + CF Investition + CF Finanzierung</pre>
<div class="hint"><div class="eyebrow">Merke</div><b>Zuführung</b> zu Rückstellungen ist zahlungsunwirksam (+), die <b>Inanspruchnahme</b> ist zahlungswirksam (−). EBITDA addiert <b>nur Abschreibungen</b>, keine Rückstellungen.</div>

<h3>Liquidität und Kapitalstruktur</h3>
<pre class="f">Working Capital = Umlaufvermögen − kurzfristige Verbindlichkeiten
L1 (Barliquidität)     = liquide Mittel / kfr. Verbindlichkeiten
L2 (einzugsbedingt)    = (liq. Mittel + kfr. Forderungen) / kfr. Verb.
L3 (umsatzbedingt)     = Umlaufvermögen / kfr. Verbindlichkeiten
Eigenkapitalquote = EK / Bilanzsumme      Verschuldungsgrad = FK / EK</pre>

<h3>Systematik</h3>
<p><b>Absolute</b> Kennzahlen (Einzelzahlen, Summen, Differenzen, Mittelwerte) vs. <b>Verhältniszahlen</b>: Gliederungszahlen (Teil/Ganzes, z. B. EK-Quote), Beziehungszahlen (verschiedenartige Größen, z. B. Umsatz je Mitarbeiter), Indexzahlen (Zeitvergleich).</p>
<p><b>Kennzahlensysteme:</b> Das <b>DuPont-/ROI-Schema</b> ist der Klassiker — es spaltet den ROI rechnerisch in Umsatzrentabilität und Kapitalumschlag und diese weiter bis auf einzelne Kostenarten. Weitere: ZVEI, RL-Kennzahlensystem, <b>Balanced Scorecard</b> (Finanzen, Kunden, interne Prozesse, Lernen & Entwicklung — mit Ursache-Wirkungs-Ketten und Strategy Map).</p>
<p><b>Grenzen:</b> Vergangenheitsorientierung, Manipulierbarkeit, Scheingenauigkeit, fehlender Kontext, Fehlanreize bei einseitiger Steuerung.</p>
<div class="trap"><div class="eyebrow">Klausurtaktik</div><b>Formel immer hinschreiben</b> — dafür gibt es explizit Punkte, unabhängig vom Zahlenergebnis. Und: Cashflow ≠ Gewinn ≠ liquide Mittel ≠ Working Capital (Strom- vs. Bestandsgröße).</div>
`,

GKR nach Steuern = (JÜ + FK-Zinsen) / GK
EKR = JÜ / EK        ROS = JÜ / Umsatz        EBIT-Marge = EBIT / Umsatz
<b>ROI = ROS × Kapitalumschlag = (JÜ/Umsatz) × (Umsatz/Kapital)</b>
ROCE = EBIT / (EK + verzinsliches FK)

stoff:`
<h3>Herkunft und Fundierung</h3>
<p>Ursprung: <b>Markowitz 1952</b>, „Portfolio Selection" aus der Finanzwirtschaft — übertragen auf strategische Geschäftseinheiten (SGE). Die <b>BCG-Matrix</b> ist theoretisch fundiert durch zwei Konzepte: den <b>Produktlebenszyklus</b> (Marktwachstum als Zeitachse) und die <b>Erfahrungskurve</b> (relativer Marktanteil als Kostenposition).</p>

<h3>Die zwei Achsen</h3>
<pre class="f">relativer Marktanteil = eigener Umsatz / Umsatz des <b>stärksten Wettbewerbers</b>
                        → Feldgrenze <b>1,0</b> (= Marktführerschaft)
absoluter Marktanteil = eigener Umsatz / Marktvolumen
Marktwachstum = (Marktvolumen_t − Marktvolumen_t−1) / Marktvolumen_t−1
                        → Feldgrenze z. B. BIP- oder Branchenwachstum

3. Dimension (Kreisgröße) = Umsatzanteil am Gesamtumsatz
                            (alternativ: DB- oder Cashflow-Anteil)</pre>
<div class="trap"><div class="eyebrow">Falle</div>Marktwachstum immer aus dem <b>Marktvolumen</b> berechnen, nicht aus dem eigenen Umsatz — und immer gegen das <b>Vorjahr</b>.</div>

<h3>Die vier Felder und ihre Normstrategien</h3>
<table class="t"><tr><th>Feld</th><th>Wachstum / rel. MA</th><th>Cashflow</th><th>Normstrategie</th></tr>
<tr><td><b>Question Mark</b></td><td>hoch / niedrig</td><td>stark negativ</td><td><b>Selektion</b>: offensiv investieren <b>oder</b> desinvestieren</td></tr>
<tr><td><b>Star</b></td><td>hoch / hoch</td><td>ausgeglichen</td><td>Investieren, Marktanteil ausbauen und halten</td></tr>
<tr><td><b>Cash Cow</b></td><td>niedrig / hoch</td><td>stark positiv</td><td>Abschöpfen / Halten — finanziert Stars und Question Marks</td></tr>
<tr><td><b>Poor Dog</b></td><td>niedrig / niedrig</td><td>gering oder negativ</td><td>Desinvestition / Rückzug</td></tr></table>
<p><b>Cashflow-Kreislauf:</b> Cash Cows finanzieren Stars und ausgewählte Question Marks. Ein ausgewogenes Portfolio braucht alle Felder — und keine Abhängigkeit von einer einzelnen Einheit.</p>

<h3>Erfahrungskurve</h3>
<pre class="f">k(2x) = L · k(x)     mit L = 0,70 – 0,80
→ 20–30 % Stückkostensenkung bei jeder Verdopplung der <b>kumulierten</b> Menge</pre>
<p>Entscheidend ist die <b>kumulierte</b> Ausbringungsmenge, nicht die Periodenmenge. Daraus folgt die strategische Logik der BCG-Matrix: hoher relativer Marktanteil → höhere kumulierte Menge → niedrigere Stückkosten → Kostenvorteil.</p>

<h3>Weitere Portfolios</h3>
<table class="t"><tr><th>Portfolio</th><th>Achsen</th><th>Besonderheit</th></tr>
<tr><td><b>BCG</b></td><td>zwei <b>mono</b>faktorielle Achsen</td><td>Marktwachstum × relativer Marktanteil, 4 Felder</td></tr>
<tr><td><b>McKinsey / GE</b></td><td>zwei <b>multi</b>faktorielle Achsen</td><td>Marktattraktivität × Wettbewerbsstärke, 9 Felder in 3 Zonen: Investition / Selektion / Abschöpfung</td></tr>
<tr><td><b>Technologie-Portfolio</b> (Pfeiffer)</td><td>Technologieattraktivität × relative Ressourcenstärke</td><td>Scoring-basiert</td></tr></table>
<pre class="f">Scoring (McKinsey, Technologie-Portfolio):
Position = Σ_j (Gewicht_j × Punktwert_j)</pre>

<h3>Kritik</h3>
<ul>
<li><b>Unabhängigkeitsannahme</b> der SGE — Verbundeffekte werden ignoriert</li>
<li>Nur <b>zwei Dimensionen</b> bei der BCG</li>
<li>Grobe Skalierung → über die Wahl der <b>Feldergrenzen manipulierbar</b></li>
<li>Basiert auf <b>Vergangenheitsdaten</b> und empirischen Regelmäßigkeiten → Normstrategien theoretisch wenig fundiert</li>
</ul>

<h3>Anschlusskonzepte</h3>
<p><b>Ansoff-Matrix</b> (Produkt × Markt, jeweils bestehend/neu): Marktdurchdringung · Marktentwicklung · Produktentwicklung · Diversifikation.<br>
<b>Porters Wettbewerbsstrategien</b>: Kostenführerschaft · Differenzierung · Fokussierung (Nische).</p>

/* ══════════════ K5 PROZESSKOSTENRECHNUNG ══════════════ */
{
id:'k5', nr:'05', titel:'Prozesskostenrechnung', prio:'B', kurz:'lmi/lmn, Prozesskostensätze, die drei Effekte — Rechnen und Theorie in einem Kapitel.',
stoff:`
<h3>Warum überhaupt?</h3>
<p>Durch Automatisierung und wachsende Variantenvielfalt ist der <b>Gemeinkostenblock in den indirekten Bereichen</b> (Einkauf, Logistik, Qualitätssicherung, Arbeitsvorbereitung) stark gewachsen. Die klassische <b>Zuschlagskalkulation</b> verteilt diese Kosten <b>wertproportional</b> auf Einzelkostenbasis — das verzerrt, weil ein teures Standardteil nicht mehr Bestellaufwand verursacht als ein billiges Exotenteil.</p>

<h3>Welche Kosten fließen ein? — das Antwortgerüst (7 Punkte)</h3>
<ol>
<li>In die PKR fließen <b>ausschließlich Kostenträgergemeinkosten</b> der <b>indirekten Leistungsbereiche</b> ein. <b>Kostenträgereinzelkosten</b> (MEK, FEK, SEK) werden weiterhin <b>direkt</b> zugerechnet.</li>
<li>Von den Gemeinkosten laufen nur die <b>repetitiven</b> Teilprozesse über die PKR — identische, wiederkehrende, standardisierbare Tätigkeiten mit messbarem Output. Gemeinkosten <b>nicht repetitiver</b> Tätigkeiten (einmalig, dispositiv, kreativ, F&amp;E, Leitung) werden weiterhin <b>geschlüsselt</b>.</li>
<li>Innerhalb der repetitiven Prozesse: <span class="k">lmi</span>-Kosten (leistungsmengen<b>induziert</b>, beschäftigungsabhängig, mit Kostentreiber und Prozessmenge) werden über den lmi-Prozesskostensatz <b>direkt</b> verrechnet. <span class="kr">lmn</span>-Kosten (leistungsmengen<b>neutral</b>, z. B. „Abteilung leiten") haben <b>keinen Kostentreiber</b> und werden <b>proportional zu den lmi-Kosten umgelegt</b> → die PKR ist damit eine <b>Vollkostenrechnung</b>.</li>
<li>Bei der Zuordnung der Kostenstellenkosten auf Teilprozesse trennt man <b>direkt zurechenbare</b> Kosten (v. a. Personalkosten über Personenjahre/Zeitanteile) von <b>indirekt zurechenbaren</b> (Sachkosten, kalkulatorische Abschreibungen und Zinsen → Schlüsselung, z. B. nach Personenjahren).</li>
<li><b>Fazit:</b> Die PKR ist eine <b>beanspruchungsgerechte Verrechnung der Gemeinkosten repetitiver Tätigkeiten über Prozesse</b>. Einzelkosten und nicht-repetitive Gemeinkosten bleiben unberührt.</li>
</ol>

<h3>Rechenschema</h3>
<pre class="f">lmi-Prozesskostensatz  = lmi-Prozesskosten_i / Prozessmenge_i
Umlagefaktor           u = Σ lmn-Kosten / <b>Σ lmi-Kosten</b>      ← Basis ist Σlmi!
umgelegte lmn-Kosten_i = Σlmn × (lmi-Kosten_i / Σ lmi-Kosten)
lmn-Prozesskostensatz  = lmi-PKS_i × u
<b>Gesamtprozesskostensatz = lmi-PKS_i × (1 + u)</b>

Hauptprozesskostensatz = Σ (Teilprozesskostensatz × Prozesskoeffizient)
Prozesskosten je Stück = (Prozessmenge je Auftrag × PKS) / Losgröße

Kontrolle: Σ (Gesamt-PKS_i × Prozessmenge_i) = Gesamtkosten der Kostenstelle</pre>
<p>Zum Vergleich traditionell: MGK-Zuschlagssatz = MGK / MEK · FGK-Zuschlagssatz = FGK / FEK.</p>
<div class="trap"><div class="eyebrow">Falle</div>Der Umlagefaktor bezieht die lmn-Kosten auf die <b>Summe der lmi-Kosten</b> — <b>nicht</b> auf die Gesamtkosten der Kostenstelle.</div>

<h3>Die drei Effekte</h3>
<table class="t"><tr><th>Effekt</th><th>Kernaussage</th></tr>
<tr><td><b>Allokationseffekt</b></td><td>Verrechnung nach <b>tatsächlicher Prozessinanspruchnahme</b> statt wertproportional → andere Kostenverteilung</td></tr>
<tr><td><b>Komplexitätseffekt</b></td><td>Komplexe und exotische Varianten werden höher belastet, Standardprodukte entlastet → <b>Ende der Quersubventionierung</b></td></tr>
<tr><td><b>Degressionseffekt</b></td><td>Prozesskosten fallen <b>je Auftrag/Los</b> an → je größer die Losgröße, desto geringer die Prozesskosten je Stück</td></tr></table>

<h3>Vorgehen — die sechs Schritte im Folienwortlaut</h3>
<table class="t"><tr><th>#</th><th>Schritt</th><th>Inhalt</th></tr>
<tr><td>1</td><td><b>Identifikation der Prozesse</b></td><td>Aufsetzen auf der gegebenen Kostenstellengliederung → <b>Tätigkeitsanalyse</b> je Kostenstelle → Teilprozesse → Prozessliste aller Kostenstellen → Trennung in <b>repetitive</b> und <b>nicht repetitive</b> Prozesse</td></tr>
<tr><td>2</td><td><b>Bestimmung der Prozesskosten</b></td><td>Zuordnung der Kosten; verrechnet werden <b>nur Gemeinkosten</b></td></tr>
<tr><td>3</td><td><b>Ermittlung der Kostentreiber</b></td><td>lmi mit Kostentreiber, lmn ohne</td></tr>
<tr><td>4</td><td><b>Bildung der Prozesskostensätze</b></td><td>lmi-Satz, lmn-Umlage, Gesamtsatz</td></tr>
<tr><td>5</td><td><b>Zusammenfassung zu Hauptprozessen</b></td><td>kostenstellen<b>übergreifend</b>, gleicher Kostentreiber</td></tr>
<tr><td>6</td><td><b>Kostenverrechnung</b></td><td>Kalkulation der Kostenträger</td></tr></table>
<div class="hint"><div class="eyebrow">Definition</div><b>Prozesskosten</b> = Summe des <b>bewerteten Faktorverzehrs sämtlicher Tätigkeiten</b> eines Prozesses.</div>

<h3>Direkte und indirekte Methode der Kostenzuordnung</h3>
<p>Bei Schritt 2 stellt sich die Frage, wie die Kostenstellenkosten auf die Teilprozesse kommen:</p>
<table class="t"><tr><th>Methode</th><th>Vorgehen</th><th>Typische Kostenarten</th></tr>
<tr><td><b>Direkte Methode</b></td><td>unmittelbare Zurechnung über gemessene Beanspruchung</td><td>Personalkosten über <b>Personenjahre / Zeitanteile</b> aus der Tätigkeitsanalyse</td></tr>
<tr><td><b>Indirekte Methode</b></td><td><b>Schlüsselung</b> proportional zu einer Bezugsgröße, meist zu den bereits verteilten Personenjahren</td><td>Sachkosten, kalkulatorische Abschreibungen und Zinsen, Raumkosten</td></tr></table>

<h3>Beurteilung</h3>
<table class="t"><tr><th>Stärken</th><th>Schwächen</th></tr>
<tr><td>Transparenz in indirekten Bereichen; kostenstellenübergreifende Prozesssicht; macht die Kosten von <b>Vielfalt und Kleinserien</b> sichtbar; Grundlage für Prozessoptimierung und Target Costing</td><td>Nur für <b>repetitive</b> Prozesse geeignet; hoher Erfassungs- und Pflegeaufwand; <b>Proportionalisierung fixer Gemeinkosten</b> → für <b>kurzfristige</b> Entscheidungen ungeeignet (dann Teilkostenrechnung)</td></tr></table>
<p>Die PKR ist ein <b>langfristig-strategisches</b> Instrument.</p>
`,
formeln:`<pre class="f">lmi-PKS_i = lmi-Kosten_i / Prozessmenge_i
u = Σ lmn / Σ lmi
lmn-PKS_i = lmi-PKS_i × u
<b>Gesamt-PKS_i = lmi-PKS_i × (1 + u)</b>

/* ══════════════ K6 TARGET COSTING ══════════════ */
{
id:'k6', nr:'06', titel:'Target Costing', prio:'A', kurz:'Was darf das Produkt kosten? Achtstufiges Rechenschema mit Zielkostenindex und Zielkostenzone.',
stoff:`
<h3>Die Grundidee</h3>
<p>Nicht: „Was <i>wird</i> das Produkt kosten?" — sondern <b>„Was <i>darf</i> das Produkt kosten?"</b>. <b>Retrograde Kalkulation</b> vom Marktpreis her.</p>
<p>Begründung: <b>80–90 % der Produktkosten werden früh festgelegt</b> (in Konzept und Konstruktion), obwohl sie erst später <b>anfallen</b>. Wer erst in der Fertigung zu sparen beginnt, kommt zu spät.</p>

<h3>Sechs Prinzipien</h3>
<ul><li><b>Price led Costing</b> — der Marktpreis bestimmt die Kosten</li>
<li><b>Focus on Customer</b> — Kundennutzen steuert die Kostenverteilung</li>
<li><b>Focus on Design</b> — Kosten werden im Entwurf gestaltet</li>
<li><b>Cross-Functional Involvement</b> — bereichsübergreifende Teams</li>
<li><b>Life Cycle Orientation</b> — gesamter Lebenszyklus</li>
<li><b>Value Chain Involvement</b> — Lieferanten einbeziehen</li></ul>

<h3>Fünf Verfahren der Zielkostenfindung</h3>
<table class="t"><tr><th>Verfahren</th><th>Kern</th></tr>
<tr><td><b>Market into Company</b></td><td>Reinform, rein marktorientiert — für <b>innovative Produkte empfohlen</b></td></tr>
<tr><td>Out of Company</td><td>aus vorhandenen Fähigkeiten und Kostenstrukturen abgeleitet</td></tr>
<tr><td>Into and out of Company</td><td>Mischform</td></tr>
<tr><td>Out of Competitor</td><td>vom Wettbewerber abgeleitet — bei echten Innovationen <b>nicht möglich</b></td></tr>
<tr><td>Out of Standard Costs</td><td>aus Standardkosten fortgeschrieben</td></tr></table>

<h3>Das Rechenschema — 8 Schritte</h3>
<pre class="f">1  Zielgewinn        = Preis × Umsatzrendite     [bei Aufschlag AUF Kosten: AC = p/(1+a)]
2  <b>Allowable Costs</b>   = Preis − Zielgewinn
3  Ziel-Herstellkosten = Allowable Costs − produktferne Gemeinkosten
                         (Verwaltung, Vertrieb, Entwicklung)
4  Zielkosten je Funktion = Funktionsgewicht_j × ZHK          [Kontrolle: Σ = ZHK]
5  Nutzenanteil n_i = Σ_j (Funktionsgewicht_j × Erfüllungsgrad_ij)
      [Erfüllungsgrade summieren SPALTENweise je Funktion auf 100 %;  Σ n_i = 100 %]
6  Zielkosten je Komponente = n_i × ZHK                       [Kontrolle: Σ = ZHK]
7  Kostenanteil:
      AC-Basis  dc_i = Drifting Costs_i / Allowable Costs   (Σ > 100 %, wenn ΣDC > AC)
      DC-Basis  dc_i = Drifting Costs_i / Σ Drifting Costs  (Σ = 100 %)
8  <b>Zielkostenindex ZKI_i = n_i / dc_i</b>
      Shortcut (AC-Basis): ZKI_i = Zielkosten_i / Drifting Costs_i

Kostenreduktionsbedarf ΔK_i = Drifting Costs_i − Zielkosten_i ;  gesamt ΔK = ΣDC − AC</pre>

<h3>Zielkostenindex lesen</h3>
<table class="t"><tr><th>ZKI</th><th>Bedeutung</th><th>Maßnahme</th></tr>
<tr><td><b>&lt; 1</b></td><td>Komponente ist <b>zu aufwendig</b> — kostet mehr, als sie Nutzen stiftet (Over-Engineering)</td><td>Kosten senken</td></tr>
<tr><td>≈ 1</td><td>in der Zielkostenzone</td><td>halten</td></tr>
<tr><td><b>&gt; 1</b></td><td>Komponente ist <b>zu einfach</b> gegenüber ihrem Nutzenbeitrag</td><td>Aufwertung möglich</td></tr></table>
<div class="trap"><div class="eyebrow">Häufigster Denkfehler</div><b>ZKI &lt; 1 = zu aufwendig.</b> Nicht umgekehrt. Der Nenner (Kostenanteil) ist zu groß gegenüber dem Zähler (Nutzenanteil).</div>

<h3>Zielkostenzone</h3>
<pre class="f">y_o = √(x² + q²)      y_u = √(x² − q²)      q = 5 % (typisch)
→ <b>Hyperbelband</b>, das mit steigendem Nutzenanteil ENGER wird
   (wichtige Komponenten werden strenger beurteilt)</pre>
<p>Toleranz je nach Aufgabentext: „5 % Abweichung vom Indexwert 1" ⇒ Bereich <b>0,95–1,05</b>; bei 15 % ⇒ 0,85–1,15.</p>

<h3>Die vier Ebenen nach Cooper/Slagmulder — und ihre Schwächen</h3>
<table class="t"><tr><th>Ebene</th><th>Was passiert</th><th>Schwäche in der Praxis</th></tr>
<tr><td><b>Market-Driven Costing</b></td><td>Ableitung von Zielpreisen und Zielkosten aus dem Markt</td><td>Für neue Produkte <b>schwierig abzuleiten</b> — es fehlt der Referenzmarkt</td></tr>
<tr><td><b>Product-Level Target Costing</b></td><td>Zielkosten auf Produktebene festlegen</td><td>Zielkosten werden in einigen Projekten <b>nicht als hartes Ziel</b> verfolgt, sondern aufgeweicht</td></tr>
<tr><td><b>Component-Level Target Costing</b></td><td>Spaltung auf Komponenten über Nutzenanteile</td><td><b>Belastbare Nutzenanteile</b> sind ohne aufwendige Marktforschung nicht verfügbar</td></tr>
<tr><td><b>Chained Target Costing</b></td><td>Weitergabe der Zielkosten in die Lieferkette</td><td>Risiko, dass die <b>Zusammenarbeit mit Lieferanten nicht nachhaltig</b> ist (Preisdruck)</td></tr></table>

<h3>Maßnahmen zur Zielkostenerreichung</h3>
<table class="t"><tr><th>Ansatzpunkt</th><th>Maßnahmen</th></tr>
<tr><td><b>Produkte</b></td><td>Komplexität verringern, <b>Gleichteile</b> verwenden, Variantenvielfalt reduzieren</td></tr>
<tr><td><b>Prozesse</b></td><td>Outsourcing, Prozessoptimierung</td></tr>
<tr><td><b>Ressourcen</b></td><td><b>Global Sourcing</b>, Abbau von Hierarchien, flexible Arbeitszeitmodelle</td></tr></table>
<p><b>Unterstützende Instrumente:</b> entwicklungsbegleitende Kalkulation · <b>Prozesskostenrechnung</b> · Benchmarking / Reverse Engineering · <b>Wertanalyse</b>.</p>

<h3>Ablauf und Begriffe</h3>
<p>Marktforschung/Produktprofil → Zielkostenermittlung → <b>Zielkostenspaltung</b> → Zielkostenerreichung.</p>
<p>Zwei Wege der <b>Zielkostenspaltung</b>: <b>Komponentenmethode</b> (direkt über ein Referenzprodukt) und <b>Funktionsmethode</b> (erst auf Funktionen, dann über die Erfüllungsmatrix auf Komponenten) — die Funktionsmethode ist die Klausurvariante.</p>
<p><b>Zielkostenerreichung:</b> Wertanalyse, Benchmarking/Reverse Engineering, Prozesskostenrechnung, entwicklungsbegleitende Kalkulation.</p>
<table class="t"><tr><th>Begriff</th><th>Bedeutung</th></tr>
<tr><td><b>Allowable Costs</b></td><td>vom Markt <b>erlaubte</b> Kosten</td></tr>
<tr><td><b>Drifting Costs</b></td><td>nach heutigem Stand <b>erwartete</b> Kosten</td></tr>
<tr><td><b>Zielkostenlücke</b></td><td>Drifting Costs − Allowable Costs</td></tr>
<tr><td><b>Target Costs</b></td><td>der ausgehandelte Kompromiss dazwischen</td></tr></table>
<div class="trap"><div class="eyebrow">Fallstricke</div>Ziel-Selbstkosten ≠ Ziel-<b>Herstell</b>kosten — produktferne Gemeinkosten extra abziehen · Marge auf den <b>Preis</b>, nicht auf die Kosten · Erfüllungsgrade summieren <b>spaltenweise</b> · AC- und DC-Basis nicht verwechseln · ändert sich eine Komponente, ändern sich <b>alle</b> Kostenanteile und Indizes.</div>
`,

/* ══════════════ K7 VERRECHNUNGSPREISE ══════════════ */
{
id:'k7', nr:'07', titel:'Verrechnungspreise', prio:'A', kurz:'Das aufwendigste Schema: Optimierung, optimaler VP, zwei Herleitungswege, Verfahrensbegründung.',
stoff:`
<h3>Die drei Funktionen</h3>
<table class="t"><tr><th>Funktion</th><th>Frage</th></tr>
<tr><td><b>Koordination / Lenkung</b></td><td>Führt die dezentrale Entscheidung zum Gesamtoptimum?</td></tr>
<tr><td><b>Erfolgsermittlung</b></td><td>Wird der Erfolg verursachungsgerecht auf die Bereiche verteilt?</td></tr>
<tr><td><b>Motivation</b></td><td>Setzt der VP die richtigen Anreize für die Bereichsleiter?</td></tr></table>
<div class="hint"><div class="eyebrow">Merksatz</div>Ein <b>einziger</b> Verrechnungspreis kann <b>nicht alle Funktionen gleichzeitig optimal</b> erfüllen — Zielkonflikt zwischen Koordination und Erfolgsermittlung. Das ist die Begründung für duale Verrechnungspreise.</div>

<h3>Das Rechenschema — 7 Schritte</h3>
<p>Ausgangslage: zweistufiger Prozess, Abteilung <b>L</b> (liefernd) → Abteilung <b>B</b> (abnehmend), <b>kein Markt</b> für das Zwischenprodukt, x₁ = x₂ = x.</p>
<pre class="f">1  Erlösfunktion       E(x) = p(x) · x
2  Gesamtgewinn        G(x) = E(x) − K_L(x) − K_B(x)     <b>(der VP kürzt sich raus!)</b>
3  notwendige Bed.     G′(x) = 0  ⟺  E′(x) = K′(x)       → x*
4  hinreichende Bed.   <b>G″(x) &lt; 0</b>                       ← die gefragte „Voraussetzung"
5  p* = p(x*)          G* = G(x*)
6  <b>VP* = K_L′(x*)</b>       Grenzkosten der liefernden Abteilung bei x*
7  G_L = VP*·x* − K_L(x*)
   G_B = p*·x* − K_B(x*) − VP*·x*
   <b>Probe: G_L + G_B = G*</b></pre>

<h3>Zweiter Herleitungsweg — gibt Extrapunkte</h3>
<p>Wenn die Aufgabe verlangt, dass die abnehmende Abteilung <b>dezentral</b> gewinnmaximal handelt:</p>
<pre class="f">G_B(x) = E(x) − K_B(x) − VP·x
dG_B/dx = E′(x) − K_B′(x) − VP = 0
→ <b>VP* = E′(x*) − K_B′(x*)</b>      — identisches Ergebnis

Gegenprobe für L:  G_L(x) = VP*·x − K_L(x),  G_L′(x) = 0 → x = x*  ✓
→ beide Abteilungen wählen dezentral genau x*.</pre>

<h3>Sonderfälle</h3>
<table class="t"><tr><th>Situation</th><th>Optimaler Verrechnungspreis</th></tr>
<tr><td>Freie Kapazität, kein Markt</td><td><b>VP* = Grenzkosten</b></td></tr>
<tr><td><b>Engpass / Vollauslastung</b></td><td><b>VP* = Grenzkosten + entgangener Deckungsbeitrag</b> (Opportunitätskosten) — bei vollkommenem Markt gleich dem Marktpreis</td></tr>
<tr><td>Markt vorhanden + Synergien</td><td>Bandbreite:<br>VP_min = Absatzmarktpreis L − externe Vertriebskosten + interne Vertriebskosten<br>VP_max = min { Beschaffungsmarktpreis + ext. Beschaffungskosten ; Absatzpreis Endprodukt − var. Kosten B }</td></tr></table>
<p><b>Zusatzauftrag prüfen — immer drei Zeilen rechnen:</b></p>
<pre class="f">DB(B)       = Verkaufspreis − var. Kosten B − VP
DB(L)       = VP − var. Kosten L
DB(Konzern) = Verkaufspreis − var. Kosten L − var. Kosten B</pre>

<h3>Verfahren mit Vor- und Nachteil</h3>
<table class="t"><tr><th>Verfahren</th><th>Vorteil</th><th>Nachteil</th></tr>
<tr><td><b>Grenzkosten</b></td><td>Koordinationsfunktion erfüllt: Gesamtoptimum auch bei dezentraler Planung; maximaler preispolitischer Spielraum für B</td><td>Erfolgslokalisierung und Motivation schlecht: L weist i. d. R. einen Verlust in Höhe der Fixkosten aus; Fehlanreiz gegen Investitionen bei L</td></tr>
<tr><td><b>Marktpreis</b></td><td>Objektiv, kaum manipulierbar; gut für die Erfolgslokalisierung</td><td>Oft kein Marktpreis vorhanden oder Markt unvollkommen; bei Synergien keine optimale Koordination → Bandbreite nötig</td></tr>
<tr><td><b>Vollkosten</b></td><td>L deckt seine Kosten; einfach, geringer Aufwand</td><td><b>Fixkostenproratierung</b> → deckungsbeitragsstarke Zusatzaufträge werden abgelehnt; willkürliche Gewinnaufteilung</td></tr>
<tr><td><b>Vollkosten + Aufschlag</b></td><td>Auch L erzielt einen Gewinn (Erfolgsermittlung möglich)</td><td>Willkürliche Gewinnermittlung, Fehlanreize</td></tr>
<tr><td><b>Verhandlung</b></td><td>Hohe Akzeptanz, Autonomie, Flexibilität</td><td>Zeitaufwand, Konfliktrisiko, monopolistisches Verhalten; erfüllt weder Lenkung noch Erfolgszuweisung sauber</td></tr>
<tr><td><b>Dualer VP</b></td><td>Koordination und Erfolgsermittlung <b>gleichzeitig</b> (L rechnet Vollkosten+, B rechnet Grenzkosten)</td><td>Administrativer Aufwand, Akzeptanzprobleme, steuerlich problematisch</td></tr></table>

<h3>Verrechnungspreise in der Praxis — die organisatorischen Fragen</h3>
<p>Neben der Höhe entscheidet die Organisation über den Erfolg. Die Typen von Verrechnungspreisen sind dabei <b>nicht überschneidungsfrei</b>; entscheidend sind <b>Einfachheit und Akzeptanz</b>. Vier Gestaltungsfragen:</p>
<ul><li><b>Wer legt die Verrechnungspreise fest?</b> Zentrale, Bereiche, Verhandlung</li>
<li><b>Gültigkeitsdauer</b> — und unter welchen Umständen darf oder muss neu festgelegt werden?</li>
<li>Wird der VP <b>konstant</b> oder <b>abhängig vom Leistungsvolumen</b> festgelegt?</li>
<li>Wie werden Konflikte zwischen den Bereichen geschlichtet?</li></ul>

<h3>Konzernverrechnungspreise</h3>
<p>Zwischen <b>rechtlich selbständigen</b> Einheiten, tatsächlich geschuldet, maßgeblich ist der <b>Fremdvergleichsgrundsatz</b> (<span class="k">dealing at arm's length</span>).</p>
<p><b>Standardmethoden:</b> Preisvergleichsmethode · Wiederverkaufspreismethode · Kostenaufschlagsmethode. <b>Gewinnorientierte Methoden:</b> TNMM (transaktionsbezogene Nettomargenmethode) · Profit Split.</p>
<p><b>Praxis:</b> Die <b>Kostenaufschlagsmethode auf Vollkostenbasis dominiert</b> (~54–56 % bei Vorprodukten und Dienstleistungen).</p>
<div class="trap"><div class="eyebrow">Fallstricke</div><b>Grenzkosten ≠ variable Stückkosten</b> bei nichtlinearen Kostenfunktionen · beim Ableiten von 0,0035x² wird 0,007x — Faktor 2 nicht vergessen · Grenzerlös ≠ Preis · den VP in die Gesamtgewinnfunktion einbauen, er kürzt sich immer heraus · <b>G″(x) &lt; 0 explizit hinschreiben</b>, das ist eine eigene Teilfrage · immer <b>G_L + G_B = G*</b> prüfen.</div>
`,
formeln:`<pre class="f">E(x) = p(x)·x
G(x) = E(x) − K_L(x) − K_B(x)
G′(x) = 0  ⟺  E′(x) = K′(x)   → x*
<b>G″(x) &lt; 0</b>  (hinreichende Bedingung / Voraussetzung)
p* = p(x*)          G* = G(x*)
<b>VP* = K_L′(x*)  =  E′(x*) − K_B′(x*)</b>
G_L = VP*·x* − K_L(x*)
G_B = p*·x* − K_B(x*) − VP*·x*      Probe: G_L + G_B = G*

Engpass:  VP* = Grenzkosten + entgangener DB
Bandbreite: VP_min = Absatzpreis L − ext. Vertriebsk. + int. Vertriebsk.
            VP_max = min{ Beschaffungspreis + ext. Beschaffungsk. ;
                          Absatzpreis Endprodukt − var. Kosten B }
Zusatzauftrag: DB(B)=p−k_B−VP · DB(L)=VP−k_L · DB(Konzern)=p−k_L−k_B</pre>`,

{q:'Die drei Funktionen von Verrechnungspreisen', a:'<b>Koordination/Lenkung · Erfolgsermittlung · Motivation.</b> Ein einziger VP kann nicht alle gleichzeitig optimal erfüllen.'},
{q:'Formel für den optimalen Verrechnungspreis', a:'<b>VP* = K_L′(x*)</b> — die <b>Grenzkosten der liefernden Abteilung</b> bei der optimalen Menge. Gleichwertig: VP* = E′(x*) − K_B′(x*).'},
{q:'Wie lautet die „Voraussetzung", nach der die Klausur fragt?', a:'Die <b>hinreichende Bedingung G″(x) &lt; 0</b> — sie sichert, dass es sich um ein Gewinn<b>maximum</b> handelt. Explizit hinschreiben.'},
{q:'Warum kürzt sich der VP aus der Gesamtgewinnfunktion?', a:'Weil er für L ein <b>Erlös</b> und für B in gleicher Höhe ein <b>Aufwand</b> ist. Konzernintern ist er erfolgsneutral — er verteilt nur um.'},
{q:'Optimaler VP bei Vollauslastung / Engpass', a:'<b>Grenzkosten + entgangener Deckungsbeitrag</b> (Opportunitätskosten). Bei vollkommenem Markt entspricht das dem Marktpreis.'},
{q:'Grenzkostenorientierter VP — Vor- und Nachteil', a:'<b>Vorteil:</b> Koordinationsfunktion erfüllt, dezentral wird das Gesamtoptimum gewählt. <b>Nachteil:</b> L weist einen Verlust in Höhe der Fixkosten aus → Erfolgslokalisierung und Motivation misslingen.'},

{q:'Wie funktioniert ein dualer Verrechnungspreis?', a:'Zwei verschiedene Preise: <b>L rechnet mit Vollkosten plus Aufschlag</b> (Erfolgsermittlung), <b>B mit Grenzkosten</b> (Koordination). Nachteil: Aufwand, Akzeptanz, steuerlich problematisch.'},

{q:'Die drei Standardmethoden für Konzern-VP', a:'<b>Preisvergleichsmethode · Wiederverkaufspreismethode · Kostenaufschlagsmethode.</b> Dazu gewinnorientiert: TNMM und Profit Split.'},

{q:'Was passiert bei grenzkostenorientiertem VP mit dem Ergebnis der liefernden Division?', a:'Sie weist typischerweise einen <b>Verlust in Höhe ihrer Fixkosten</b> aus — auch wenn sie effizient arbeitet. Deshalb versagt die Erfolgslokalisierung.'},

{titel:'Division L und A — Tabellenvariante der Folien', kontext:`<p>Division <b>L</b> (Lieferdivision) produziert ein Zwischenprodukt X, das Division <b>A</b> (Abnehmerdivision) zum Endprodukt Y weiterverarbeitet und am Markt anbietet. Je Endprodukt genau ein Zwischenprodukt, für X besteht <b>kein Markt</b> (x = y).</p>

<p class="muted">Hier wird nicht abgeleitet, sondern zeilenweise verglichen — dieselbe Logik, anderes Werkzeug.</p>`,

 {t:'num', q:'Gesamtgewinn im Optimum', unit:'€', sol:22000, weg:'140 · 400 − 21.000 − 13.000 = <b>22.000 €</b>'},
 {t:'num', q:'Optimaler Verrechnungspreis bei Grenzkostenorientierung', unit:'€', sol:50, weg:'K_L = 50x + 1.000 ist <b>linear</b> → Grenzkosten konstant <b>50 €</b>.\nHier gilt ausnahmsweise Grenzkosten = variable Stückkosten, weil die Kostenfunktion linear ist.'},
 {t:'num', q:'Gewinn der Division L (mit Vorzeichen)', unit:'€', sol:-1000, weg:'G_L = 50 · 400 − 21.000 = 20.000 − 21.000 = <b>−1.000 €</b>\nGenau die <b>Fixkosten</b> von 1.000 € bleiben ungedeckt.'},
 {t:'num', q:'Gewinn der Division A', unit:'€', sol:23000, weg:'G_A = 140 · 400 − 13.000 − 20.000 = <b>23.000 €</b>\nProbe: −1.000 + 23.000 = 22.000 = G* ✓'},
 {t:'offen', q:'Was zeigt dieses Ergebnis über die Funktionen von Verrechnungspreisen?', muster:`Der grenzkostenorientierte VP erfüllt die <b>Koordinationsfunktion perfekt</b>: Division A rechnet mit 50 € Zusatzkosten je Stück und wählt dezentral genau die gesamtoptimale Menge von 400 Stück. Die Summe der Bereichsgewinne entspricht exakt dem Gesamtgewinn.<br><br>
Die <b>Erfolgsermittlung</b> misslingt dagegen vollständig: Division L weist einen <b>Verlust von 1.000 €</b> aus — genau ihre Fixkosten — obwohl sie exakt das produziert, was das Unternehmen will. Division A vereinnahmt mit 23.000 € mehr als den Gesamtgewinn.<br><br>
Und damit misslingt auch die <b>Motivation</b>: Wird der Leiter von L an seinem Bereichsergebnis gemessen, hat er einen Anreiz, die interne Lieferung zu vermeiden oder Kapazität abzubauen.<br><br>
<b>Fazit:</b> Der Fall belegt den Merksatz — ein einziger Verrechnungspreis kann Koordination und Erfolgsermittlung nicht gleichzeitig optimal erfüllen. Lösungsansatz: <b>dualer Verrechnungspreis</b> (L rechnet Vollkosten plus Aufschlag, A rechnet Grenzkosten).`}
]},

 {t:'mc', q:'Ein Zusatzauftrag mit positivem Konzern-DB wird von der abnehmenden Abteilung abgelehnt. Welcher VP wurde vermutlich verwendet?', opts:['Grenzkosten','Vollkosten','Marktpreis bei vollkommenem Markt','Dualer VP'], r:1, weg:'Die <b>Fixkostenproratierung</b> lässt den Auftrag aus Bereichssicht unrentabel erscheinen. Klassischer Nachteil des Vollkosten-VP.'},
 {t:'mc', q:'Im <b>vollkommenen</b> Markt gilt für Marktpreise als Verrechnungspreis:', opts:['Es sind Anpassungen wegen Synergien nötig','Es sind keine Anpassungen nötig','Sie führen immer zu Fehlsteuerung','Sie sind steuerlich unzulässig'], r:1, weg:'Anpassungen (Bandbreiten) braucht es bei <b>unvollkommenem</b> Markt oder bei Synergien. Klassische Wahr/Falsch-Zeile.'},
 {t:'offen', q:'Warum kann ein einziger Verrechnungspreis nicht alle drei Funktionen erfüllen?', muster:`Die Funktionen stellen <b>widersprüchliche Anforderungen</b> an die Preishöhe.<br><br>
Für die <b>Koordination</b> muss der VP den <b>Grenzkosten</b> entsprechen: nur dann wählt die abnehmende Abteilung die gesamtoptimale Menge, weil sie die tatsächlichen Zusatzkosten des Konzerns in ihre Rechnung übernimmt.<br><br>
Für die <b>Erfolgsermittlung</b> müsste der VP dagegen mindestens die <b>Vollkosten plus einen Gewinnanteil</b> abdecken — sonst weist die liefernde Abteilung strukturell einen Verlust in Höhe ihrer Fixkosten aus, obwohl sie effizient arbeitet.<br><br>
Für die <b>Motivation</b> gilt dasselbe Problem: ein grenzkostenbasierter VP setzt Fehlanreize gegen Investitionen und Kapazitätsaufbau bei L.<br><br>
Da ein Preis nicht gleichzeitig bei den Grenzkosten und über den Vollkosten liegen kann, gibt es entweder einen <b>Kompromiss</b> zulasten aller Funktionen oder <b>duale Verrechnungspreise</b> (L rechnet Vollkosten+, B rechnet Grenzkosten) — mit dem Preis von administrativem Aufwand und steuerlichen Problemen.`}
]}

{
id:'k8', nr:'08', titel:'Total Cost of Ownership', prio:'C', kurz:'Barwertvergleich über den Lebenszyklus. Nur RBF und Diskontierung — in einer Sitzung erledigt.',
stoff:`
<h3>Definition und Bild</h3>
<p><span class="k">TCO</span> ermittelt die <b>Gesamtkosten über den Lebenszyklus eines Objekts mit langer Nutzungsdauer</b>, um Beschaffungs- und Implementierungsentscheidungen zu treffen. Das Standardbild ist der <b>Eisberg</b>: der Anschaffungspreis ist nur die sichtbare Spitze.</p>

<h3>Kostenblöcke nach Ellram</h3>
<table class="t"><tr><th>Block</th><th>Inhalte</th></tr>
<tr><td><b>Pre-Transaktion</b></td><td>Bedarfsidentifikation, Suche und Bewertung von Bezugsquellen, Lieferantenintegration und -schulung</td></tr>
<tr><td><b>Transaktion</b></td><td><b>Preis</b>, Bestellabwicklung, Transport, Zölle, Rechnungsprüfung, Inspektion</td></tr>
<tr><td><b>Post-Transaktion</b></td><td>Ausfallzeiten, defekte Teile, Reparatur, Instandhaltung, Reklamationen, Retouren, <b>Entsorgung</b></td></tr></table>

<h3>Entwicklung der Kostenanteile im Produktlebenszyklus</h3>
<p>Der Anteil des Anschaffungspreises an den Gesamtkosten hängt davon ab, wie lange das Objekt genutzt wird:</p>
<table class="t"><tr><th>Objekt</th><th>Nutzungsdauer</th><th>Kostenstruktur</th></tr>
<tr><td>Mittagessen</td><td>sofort verbraucht</td><td>praktisch <b>100 % Anschaffungspreis</b> — TCO wäre sinnlos</td></tr>
<tr><td>PKW</td><td>ca. 11 Jahre</td><td>Anschaffung ist nur ein Teil; <b>Betriebs-, Instandhaltungs- und Investitionskosten</b> dominieren</td></tr></table>
<p>Deshalb ist TCO nur für Objekte mit <b>langer Nutzungsdauer</b> das richtige Instrument — genau so steht es in der Definition.</p>

<h3>Abgrenzung zum Life Cycle Costing</h3>
<table class="t"><tr><th>Gemeinsamkeiten</th><th>Unterschiede</th></tr>
<tr><td>Beide sind <b>strategisches Kostenmanagement</b> und erfassen die Kosten über den <b>gesamten Lebenszyklus</b> als Entscheidungsgrundlage</td><td><b>LCC</b> berücksichtigt <b>Transaktionskosten</b> und weitere TK-Kategorien nur teilweise oder gar nicht und wird aus <b>Produzentensicht</b> geführt. <b>TCO</b> wird aus <b>Käufer-/Nutzersicht</b> geführt.</td></tr></table>

<h3>Sieben Schritte</h3>
<p>Alternativen identifizieren → Prozesse beschreiben → Kostenkategorien identifizieren → Kosten schätzen → TCO berechnen → vergleichen und <b>Sensitivität</b> prüfen → entscheiden.</p>

<h3>Rechnen</h3>
<pre class="f">TCO = A₀ + Σ_{t=1..n} A_t / (1+i)^t

<b>Rentenbarwertfaktor  RBF(i,n) = ((1+i)^n − 1) / (i · (1+i)^n)</b>
   → Barwert einer gleichbleibenden Zahlung = jährliche Zahlung × RBF

Abzinsungsfaktor = 1 / (1+i)^t
Kapitalwert K₀ = −A₀ + Σ (E_t − A_t)/(1+i)^t ;  vorteilhaft wenn K₀ &gt; 0</pre>
<div class="trap"><div class="eyebrow">Fallstricke</div><b>t₀ nicht diskontieren</b> · einmalige Sonderzahlungen nicht als Rente behandeln · „je Mitarbeiter" vs. „je Arbeitsplatz" sauber trennen und die Annahme notieren · <b>Nominal- und Barwertvergleich können die Rangfolge umdrehen</b> · nur zahlungswirksame Größen ansetzen (keine kalkulatorischen Abschreibungen zusätzlich zur Anschaffung — Doppelzählung) · Entsorgungskosten am Zyklusende nicht vergessen · bei unterschiedlichen Nutzungsdauern vereinheitlichen.</div>

<h3>Die kritische Ergänzung — fast immer gefragt</h3>
<p>TCO erfasst <b>keine Nutzen oder Erträge</b>. Ein neues System kann Prozessverbesserungen, Skalierbarkeit und geringere Fehleranfälligkeit bringen, die in einer reinen TCO-Rechnung <b>unbewertet</b> bleiben. Ebenso fehlen in der Regel Sensitivitäts- und Risikobetrachtungen. Wer das in der Antwort ergänzt, holt die letzten Punkte.</p>
`,
formeln:`<pre class="f">TCO = A₀ + Σ A_t / (1+i)^t
<b>RBF(i,n) = ((1+i)^n − 1) / (i·(1+i)^n)</b>
Barwert Rente = jährliche Zahlung × RBF
Abzinsungsfaktor = 1/(1+i)^t

stoff:`
<h3>Grundbegriffe</h3>
<p><b>Brundtland-Definition (1987):</b> Nachhaltige Entwicklung deckt die <b>Bedürfnisse der Gegenwart</b>, ohne die Fähigkeit <b>künftiger Generationen</b> zu gefährden, ihre eigenen Bedürfnisse zu decken.</p>
<p><b>Triple Bottom Line</b> (Elkington): <b>ökologisch + sozial + ökonomisch</b>, gleichrangig — „People, Planet, Profit".</p>
<div class="hint"><div class="eyebrow">Der prüfungsrelevante Unterschied</div><b>ESG</b> ersetzt die <b>ökonomische</b> Komponente durch <b>Governance</b>: <b>E</b>nvironmental, <b>S</b>ocial, <b>G</b>overnance. Genau das ist der Unterschied zur Triple Bottom Line.</div>

<h3>Berichterstattung</h3>
<p>Entwicklung: <b>HGB-Lagebericht → CSR-Richtlinie → CSRD</b> (Corporate Sustainability Reporting Directive).</p>
<p><b>Standards:</b> GRI (Global Reporting Initiative) · <b>ESRS</b> (European Sustainability Reporting Standards, für die CSRD) · ISSB/SASB.</p>
<p><b>Doppelte Materialität:</b> Ein Thema ist wesentlich, wenn <b>impact materiality</b> (inside-out: Wirkung des Unternehmens auf Umwelt und Gesellschaft) <b>oder</b> <b>financial materiality</b> (outside-in: Wirkung von Nachhaltigkeitsthemen auf das Unternehmen) vorliegt — <b>eines von beiden genügt</b>.</p>

<h3>Green IT</h3>
<p><b>Definition:</b> Sparsamer Umgang mit Ressourcen <b>durch</b> IT.</p>
<table class="t"><tr><th>Direkte Effekte</th><th>Indirekte Effekte</th></tr>
<tr><td>Energiesparende Hard- und Software, effiziente Kühlung, <b>Thin Clients</b>, Virtualisierung, Green Data Center</td><td>Schulungen, <b>Videokonferenzen statt Dienstreisen</b>, IT-Outsourcing (Skaleneffekte), Collaboration-Tools, papierlose Prozesse</td></tr></table>
<pre class="f"><b>PUE = Gesamtenergie Rechenzentrum / Energie IT-Geräte</b>
   Power Usage Effectiveness — Idealwert <b>1,0</b>
   (alles über 1,0 ist Kühlung, USV, Beleuchtung)</pre>

<h3>KPMG True Value / TrueTCO (Volvo)</h3>
<p><b>Drei Schritte:</b></p>
<ol><li>Externalitäten identifizieren und <b>monetarisieren</b></li>
<li>Wirkung der <b>Internalisierung</b> auf künftige Erträge bewerten — Treiber: <b>Regulierung, Stakeholder, Markt</b></li>
<li><b>Business Cases</b> entwickeln</li></ol>
<p><b>TrueTCO</b> = konventionelle TCO + monetarisierte Umwelt- und Sozialeffekte, <b>bereinigt um Steueranreize</b> (<span class="k">level playing field</span>).</p>
<p><b>Ergebnis der Volvo-Studie:</b> Der Elektrobus ist <b>finanziell teurer</b>, in der TrueTCO aber <b>günstiger</b> als Diesel und Biogas — die einzige Technologie, deren Kosten durch die „True-Brille" <b>sinken</b>.</p>

<h3>Green IT im Controlling umsetzen</h3>
<p>Nach Gadatsch/Mayer läuft die Umsetzung über denselben Regelkreis wie jedes andere Controlling-Thema: <b>Ziele festlegen → Kennzahlen definieren → messen → berichten → gegensteuern</b>. Konkret heißt das:</p>
<ul><li><b>Transparenz schaffen</b>: Energie- und Ressourcenverbrauch der IT überhaupt erst messbar machen (Zähler je Rechenzentrum, je Standort)</li>
<li><b>Kennzahlen definieren</b>: <b>PUE</b>, kWh je Arbeitsplatz, CO₂ je IT-Service, Auslastungsgrade der Server</li>
<li><b>In bestehende Instrumente integrieren</b>: IT-Kostenrechnung, <b>TCO</b>-Rechnungen um Energie- und Entsorgungskosten erweitern, IT-Portfolio um ökologische Kriterien ergänzen</li>
<li><b>Berichten</b>: Aufnahme in IT-Dashboards und in die Nachhaltigkeitsberichterstattung</li></ul>
<p>Große Anwender berichten das öffentlich — die Folien zeigen dazu SAP (Integrierter Bericht) und die Software AG als Beispiele.</p>

<h3>Nachhaltigkeitscontrolling</h3>
<p>Nachhaltigkeitscontrolling gilt als <b>konsequente Weiterentwicklung des klassischen Controllings</b>: dessen Stärke ist die <b>Messbarmachung komplexer Sachverhalte</b> — und genau daran scheitern Nachhaltigkeitsstrategien sonst.</p>
<p>Aufgabe: Nachhaltigkeitsziele operationalisieren, mit Kennzahlen unterlegen, in Planung und Berichterstattung integrieren. Instrumente: <b>Sustainability Balanced Scorecard</b> (verbindet die Nachhaltigkeitskennzahlen mit der klassisch-finanziellen Steuerung), CO₂-Bilanz/Carbon Footprint, Ökobilanz (LCA), Wesentlichkeitsanalyse, Stakeholderdialog. Berichtsform in der Praxis meist das <b>Dashboard</b>.</p>
<div class="trap"><div class="eyebrow">Achtung</div>Der Nachhaltigkeitsbegriff ist <b>nicht einheitlich definiert</b> — das erschwert die Messung erheblich und ist ein guter Einstiegssatz für jede Theorieantwort in diesem Kapitel.</div>
<p><b>Kernaussage:</b> Kennzahlen müssen <b>aus der Strategie und dem Geschäftsmodell abgeleitet</b> werden — nicht aus einem Standardkatalog übernommen. Die Umweltdimension ist am branchenspezifischsten, Sozialkennzahlen sind am ehesten übertragbar.</p>
`,

{
id:'fs', nr:'10', titel:'Fallstudien-Artikel', prio:'B', kurz:'Sieben Artikel, je fünf Merkpunkte — Material für 5–8-Punkte-Aufgaben.',
stoff:`
<h3>Warum das lohnt</h3>
<p>Zu <b>jedem</b> Artikel gibt es eigene Übungsfragen. Das ist klassisches Material für Transferaufgaben mit 5–8 Punkten. Pro Artikel reichen <b>fünf Merkpunkte</b> — mehr braucht es nicht.</p>

<h3>TRUMPF — Konzernverrechnungspreise</h3>
<ol><li><b>Zielpriorisierung:</b> steuerliche <b>Angemessenheit vor Steueroptimierung</b>.</li>
<li><b>Fünf Funktionsbereiche mit je eigener Methode:</b> Dienstleistung und Produktion → <b>Kostenaufschlag</b>; Vertrieb → <b>Wiederverkaufspreis</b>; Produktcenter → <b>Residualergebnis</b>; Technologiecenter → <b>Fertigungslizenz</b>.</li>
<li><b>Gewinnzuschlag = WACC × betriebsnotwendiges Kapital</b>, umgerechnet in einen Zuschlagssatz auf die Standardfertigungskosten — Bezug zu kalkulatorischen Zinsen.</li>
<li>Die <b>Fertigungslizenz</b> ist so bemessen, dass jedes Entwicklungsprojekt über <b>fünf Absatzjahre einen Kapitalwert von null</b> erreicht (Grundsatz der tragfähigen Investition).</li>
<li>Vermeidung der <b>Mehrfachbezuschlagung</b>: Gewinnzuschlag nur auf Fertigungskosten, nicht auf durchgereichtes Material.</li></ol>

<h3>Verrechnungspreise in der Praxis — Studie, N = 124</h3>
<ol><li><b>Kostenaufschlagsmethode dominiert</b> (54–56 % bei Vorprodukten und Dienstleistungen).</li>
<li>Kostenumfang: <b>Vollkosten ~77–81 %</b>, Grenzkosten nur 2–5 %.</li>
<li>Bedeutendste Funktionen: <b>steuerliche Compliance und Transparenz</b>.</li>
<li>Größter Handlungsbedarf: Transparenz, Vereinfachung, Entscheidungsunterstützung.</li>
<li>Zweikreissysteme (14 %), duale VP (13 %) und APAs werden <b>kaum genutzt</b> — zu aufwendig.</li></ol>

<h3>Bäckerei Schäfer's Brotstuben — PKR im Mittelstand</h3>
<ol><li><b>Anlass:</b> Verdrängungswettbewerb, steigende Rohstoffpreise, <b>Automatisierung → wachsender Gemeinkostenblock</b>; die Zuschlagskalkulation verzerrt.</li>
<li>Trennung in <b>personal-</b> und <b>anlagenorientierte</b> Teilprozesse; Personalkosten über <b>minutenbezogene</b> Sätze je Lohngruppe.</li>
<li><b>Prozesskoeffizient</b> = Sollzeit für die einmalige Prozessdurchführung (TDABC, <b>netto</b>, ohne Rüst- und Verteilzeiten).</li>
<li><b>Nicht abgedeckt:</b> Verwaltungskosten (nur Umlage), Materialeinzelkosten, Leerkosten.</li>
<li><b>Erfolgsfaktoren:</b> <b>frühzeitiger Einbezug der Mitarbeiter</b> und <b>Einfachheit</b> — keine Scheingenauigkeit durch zu tiefe Differenzierung.</li></ol>

<h3>Westnetz / Process Mining — strategische PKR</h3>
<ol><li><b>Drei Dimensionen:</b> die PKR liefert <b>Kosten</b>, Process Mining liefert <b>Zeit und Qualität</b>.</li>
<li><b>Process Mining</b> = Rekonstruktion der tatsächlichen Prozessabläufe aus dem „digitalen Fußabdruck".</li>
<li>Benötigt <b>drei Informationen</b>: Identifikationskriterium, Zeitstempel, Prozessschritt.</li>
<li><b>Kreislauf der strategischen PKR:</b> Tätigkeitsanalyse (Vollzeitäquivalente) → Kostenverteilung → <b>lmi direkt, lmn geschlüsselt</b> → Ergänzung um IT-Kosten; mindestens jährlich aktualisiert.</li>
<li><b>Kernzahl:</b> <b>1,5 % ausgesteuerte Vorgänge verursachen über 50 % der manuellen Kosten</b> → Optimierungspotenzial wird bezifferbar.</li></ol>

<h3>Audi — Zielkostenmanagement in der Praxis</h3>
<ol><li>Renditekorridor <b>8–10 %</b> als Vorstandsvorgabe; Zielkostenfindung nach <b>market into company</b>.</li>
<li>Eigenschaftsprofilierung über die <b>Fahrzeug-Eigenschaftsspinne</b> (~11 Felder, ~100 Kerneigenschaften) — <b>bewusst keine Conjoint-Analyse</b>, weil bei rund 5.000 Komponenten zu aufwendig.</li>
<li>Top-down-Spaltung auf 5 Baugruppen → Abstimmung im <b>„Target-Rütteln"</b> → Bottom-up-Bewertung → <b>Target gap</b> → TOK-Runden.</li>
<li><b>Keine Vollkostenbasis:</b> targetiert werden Einzelkosten (Material, Fertigungspersonal) und projektabhängige Aufwendungen; <b>Gemeinkosten werden fortgeschrieben</b>, nicht targetiert.</li>
<li><b>Wirkung:</b> Zielüberschreitung in den drei Jahren vor SOP um rund <b>90 % reduziert</b>; Wegbereiter ins Premiumsegment.</li></ol>

<h3>Volvo / KPMG True Value — TrueTCO Elektrobus</h3>
<ol><li><b>Drei Schritte:</b> Externalitäten identifizieren und <b>monetarisieren</b> → Wirkung der <b>Internalisierung</b> auf künftige Erträge (Treiber: Regulierung, Stakeholder, Markt) → Business Cases.</li>
<li><b>TrueTCO</b> = konventionelle TCO + monetarisierte Umwelt-/Sozialeffekte, <b>bereinigt um Steueranreize</b> (level playing field).</li>
<li>Neun Indikatoren aus <b>Stakeholderdialog und Wesentlichkeitsanalyse</b>; Darstellung als <b>Value Bridge</b>.</li>
<li><b>Ergebnis:</b> Der Elektrobus ist finanziell teurer, in der TrueTCO <b>günstiger</b> als Diesel und Biogas — die einzige Technologie, deren Kosten durch die True-Brille <b>sinken</b>.</li>
<li><b>Beispielwerte:</b> CO₂ 134 USD/t (= schwedische CO₂-Steuer), Reisezeit ~6,5 USD/h; Hochrechnung 225 Mio. USD/Jahr Ersparnis, davon 45 Mio. Gesundheitskosten.</li></ol>

<h3>flaschenpost — Nachhaltigkeitscontrolling im E-Commerce</h3>
<ol><li><b>Governance als Fundament</b> plus drei Säulen: ressourcenschonender Betrieb (E), nachhaltige Sortimente (E), verantwortungsvoller Arbeitgeber (S) — die Struktur folgt <b>ESG</b>, nicht der Triple Bottom Line.</li>
<li><b>Sechs Fokusthemen:</b> #flaschenpostgoeszero, #regioheroes, #zerowaste, #circulareconomy, #wirsindflaschenpost, #safetyfirst.</li>
<li><b>Kennzahlen Betrieb:</b> kWh je Lagerstandort (absolut), <b>kWh/m²</b> (relativ), Anzahl auf Grünstrom umgestellter Standorte; dazu Treibstoff je Lieferfahrt und je Bestellung.</li>
<li><b>Branchenspezifika:</b> Letzte-Meile-Logistik, Kühllager und Verpackung, körperlich fordernde Auslieferung → <b>Tragehilfen = #safetyfirst</b>.</li>
<li><b>Kernaussage:</b> Kennzahlen müssen <b>aus Strategie und Geschäftsmodell abgeleitet</b> werden; die Umweltdimension ist am branchenspezifischsten, Sozialkennzahlen am übertragbarsten.</li></ol>
`,

let P = {done:{}, cards:{}};
let saveTimer=null;
async function load(){
  try{ const r = await window.storage.get('ctrl_progress'); if(r&&r.value) P = JSON.parse(r.value); }
  catch(e){ /* erster Start oder kein Speicher */ }
  if(!P.done) P.done={}; if(!P.cards) P.cards={}; if(P.sort) SORT=P.sort;
  // altes Kartenformat ('ok'/'again') auf den neuen Zustand heben
  Object.keys(P.cards).forEach(k=>{
    if(typeof P.cards[k] === 'string')
      P.cards[k] = srNext(null, P.cards[k]==='ok');
  });
}

async function pullAll(){
  if(!online) return;
  try{
    const [a,c] = await Promise.all([
      sb.from('step_attempts').select('kapitel,aufgabe_idx,schritt_idx,ergebnis'),
      sb.from('card_reviews').select('kapitel,karte_idx,wiederholungen,intervall_tage,leichtigkeit,faellig_am,zuletzt_ok')
    ]);
    if(a.data) a.data.forEach(r=>{
      if(r.ergebnis==='richtig' || r.ergebnis==='selbst')
        P.done[r.kapitel+'|'+r.aufgabe_idx+'|'+r.schritt_idx] = true;
    });
    if(c.data) c.data.forEach(r=>{
      P.cards[r.kapitel+'|'+r.karte_idx] = {
        wdh:r.wiederholungen, ef:+r.leichtigkeit, iv:r.intervall_tage,
        due:r.faellig_am, ok:r.zuletzt_ok
      };
    });
    save();
  }catch(e){ console.warn('Abgleich fehlgeschlagen:', e); }
}

async function gradeCard(key, ok){
  const [kap, idx] = [key.slice(0, key.indexOf('|')), key.slice(key.indexOf('|')+1)];
  P.cards[key] = srNext(P.cards[key], ok);   // sofort lokal, damit die UI nicht wartet
  save();
  if(!online) return;
  try{
    const { data, error } = await sb.rpc('karte_bewerten',
      { p_kapitel: kap, p_karte_idx: +idx, p_gewusst: ok });
    if(!error && data){
      P.cards[key] = { wdh:data.wiederholungen, ef:+data.leichtigkeit,
                       iv:data.intervall_tage, due:data.faellig_am, ok:data.zuletzt_ok };
      save();
    }
  }catch(e){ console.warn('karte_bewerten:', e); }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async()=>{
    try{ await window.storage.set('ctrl_progress', JSON.stringify(P)); }catch(e){}
  },400);
}

/* ---------- Zählen ---------- */
function chTotal(c){ return c.karten.length + c.aufgaben.reduce((s,a)=>s+a.steps.length,0); }
function chDone(c){
  let n=0;
  c.karten.forEach((_,i)=>{ const s=P.cards[c.id+'|'+i]; if(s && s.ok) n++; });
  c.aufgaben.forEach((a,ai)=>a.steps.forEach((_,si)=>{ if(P.done[c.id+'|'+ai+'|'+si]) n++; }));
  return n;
}
function kurzText(c){ let s=c.kurz.split('—')[0].trim(); return s.length>58? s.slice(0,56).trim()+'…' : s; }
function totals(){
  let d=0,t=0; CH.forEach(c=>{ d+=chDone(c); t+=chTotal(c); }); return {d,t};
}
function sollPct(){
  const now=new Date();
  const p=(now-LERNSTART)/(KLAUSUR-LERNSTART);
  return Math.max(0,Math.min(1,p))*100;
}
function tage(){ return Math.max(0, Math.ceil((KLAUSUR-new Date())/86400000)); }

/* ---------- Hilfen ---------- */
const $ = s=>document.querySelector(s);
function fmt(n,d){ return n.toLocaleString('de-DE',{minimumFractionDigits:d||0,maximumFractionDigits:d===undefined?4:d}); }
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function parseNum(s){
  if(s==null) return NaN;
  s=String(s).trim().replace(/[€%\s]/g,'').replace(/[^0-9,.\-]/g,'');
  if(!s) return NaN;
  const hasC=s.includes(','), hasD=s.includes('.');
  if(hasC&&hasD){ s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(hasC){ s=s.replace(/\./g,'').replace(',','.'); }
  else if(hasD){
    const parts=s.split('.');
    const last=parts[parts.length-1];
    if(parts.length>1 && last.length===3 && parts[0].length<=3) s=s.replace(/\./g,'');
  }
  return parseFloat(s);
}
function checkNum(v,sol,tol){
  if(isNaN(v)) return 'wrong';
  const t = Math.max(tol||0, Math.abs(sol)*0.003, 0.005);
  const d = Math.abs(v-sol);
  if(d<=t) return 'right';
  if(d<=Math.abs(sol)*0.025+0.05) return 'close';
  return 'wrong';
}

/* ---------- Soll-Ist-Balken (Signature) ---------- */
function sib(istPct, showSoll){
  const soll=sollPct(), abw=istPct-soll;
  const neg = showSoll && abw < -3;
  return '<div class="sib '+(neg?'neg':'')+'">'
    +'<div class="ist" style="width:'+Math.min(100,istPct).toFixed(1)+'%"></div>'
    +(showSoll?'<div class="soll" style="left:'+soll.toFixed(1)+'%"></div>':'')
    +'<div class="lbl">'+Math.round(istPct)+'%</div></div>';
}

  let h='<div class="pagehead"><div class="eyebrow">'+nrTxt+' · Priorität '+c.prio+'</div><h2>'+c.titel+'</h2><div class="sub">'+c.kurz+'</div></div>';
  h+='<div class="tabs">'+tabs.map(t=>'<div class="tab'+(view.tab===t[0]?' on':'')+'" tabindex="0" data-tab="'+t[0]+'">'+t[1]+'</div>').join('')+'</div>';
  if(view.tab==='stoff') h+='<div class="card prose">'+c.stoff+'</div>';
  else if(view.tab==='formeln') h+='<div class="card prose"><h3>Formelübersicht '+c.titel+'</h3>'+c.formeln+'</div>';
  else if(view.tab==='karten') h+=vCards(c);
  else h+=vAufgaben(c);
  return h;
}

/* ---------- Karteikarten ---------- */
let deck=[], di=0, flipped=false, deckLabel='';
function startDeck(list,label){ deck=list; di=0; flipped=false; deckLabel=label; }
function sortDeck(list){
  const f = list.filter(k=>cardFaellig(k.key));
  const r = list.filter(k=>!cardFaellig(k.key));
  // Faellige zuerst, die schwersten (niedrigster Ease-Faktor) vorn
  f.sort((a,b)=>{
    const sa=cardState(a.key), sb2=cardState(b.key);
    return (sa? sa.ef : 2.0) - (sb2? sb2.ef : 2.0);
  });
  r.sort((a,b)=>(cardState(a.key).due||'').localeCompare(cardState(b.key).due||''));
  return {faellig:f, ruhend:r};
}
function deckKopf(f, r){
  if(!f.length && r.length)
    return '<div class="hint" style="margin-top:0"><div class="eyebrow">Nichts faellig</div>'
      +'Alle '+r.length+' Karten dieses Stapels ruhen noch — die naechste ist am <b>'
      +new Date(cardState(r[0].key).due).toLocaleDateString('de-DE')+'</b> wieder dran. '
      +'Du kannst trotzdem durchgehen; die Intervalle werden dabei neu gesetzt.</div>';
  if(f.length)
    return '<div class="muted" style="margin-bottom:14px"><b>'+f.length+'</b> faellig'
      +(r.length? ' · '+r.length+' ruhen bis spaeter':'')
      +' — schwerste zuerst.</div>';
  return '';
}
function vCards(c){
  const alle = c.karten.map((k,i)=>({...k, key:c.id+'|'+i, ch:c.titel}));
  const {faellig, ruhend} = sortDeck(alle);
  startDeck(faellig.length ? faellig : ruhend, c.titel);
  return deckKopf(faellig, ruhend) + '<div id="deck"></div>';
}
function vKarten(){
  let all=[];
  ordered().forEach(c=>c.karten.forEach((k,i)=>all.push({...k, key:c.id+'|'+i, ch:c.titel})));
  const {faellig, ruhend} = sortDeck(all);
  startDeck(faellig.length ? faellig : ruhend, 'Alle Kapitel');
  const neu = faellig.filter(k=>!cardState(k.key)).length;
  return '<div class="pagehead"><div class="eyebrow">Karteikarten</div><h2>Heute faellig</h2>'
   +'<div class="sub">Karten kommen nach einem wachsenden Intervall zurueck: 1 Tag, 3 Tage, dann '
   +'nach Schwierigkeit gestreckt, hoechstens 21 Tage. Was du als <b>nochmal</b> markierst, '
   +'ist sofort wieder im Stapel.</div></div>'
   + (faellig.length
      ? '<div class="muted" style="margin-bottom:14px"><b>'+faellig.length+'</b> faellig'
        +(neu? ', davon '+neu+' zum ersten Mal':'')
        +(ruhend.length? ' · '+ruhend.length+' ruhen':'')+'</div>'
      : deckKopf(faellig, ruhend))
   +'<div id="deck"></div>';
}
function drawDeck(){
  const el=document.getElementById('deck'); if(!el) return;
  if(!deck.length){ el.innerHTML='<div class="card">Keine Karten vorhanden.</div>'; return; }
  if(di>=deck.length){
    const ok=deck.filter(k=>{ const s=P.cards[k.key]; return s && s.ok; }).length;
    el.innerHTML='<div class="card" style="text-align:center;padding:40px 22px">'
     +'<div class="eyebrow">Stapel durch</div>'
     +'<h3 style="font-size:24px;margin-bottom:8px">'+ok+' von '+deck.length+' gewusst</h3>'
     +'<p class="muted" style="max-width:44ch;margin:0 auto 18px">'+(ok===deck.length?'Sauber. Die Karten kommen von selbst zurueck, wenn sie faellig sind.':'Was du als <b>nochmal</b> markiert hast, ist heute noch einmal faellig.')+'</p>'
     +'<button id="again">Nochmal durchgehen</button></div>';
    document.getElementById('again').onclick=()=>{ di=0; flipped=false; drawDeck(); };
    return;
  }
  const k=deck[di];
  el.innerHTML='<div class="muted mono" style="text-align:center;margin-bottom:12px;font-size:12px">'
    +(di+1)+' / '+deck.length+' · '+esc(k.ch)+'</div>'
    +'<div class="flip'+(flipped?' on':'')+'" id="flip"><div class="flip-in">'
    +'<div class="face"><div class="tag">Frage</div><div class="q">'+k.q+'</div>'
      +'<div class="muted" style="margin-top:16px;font-size:12.5px">Tippen zum Umdrehen</div></div>'
    +'<div class="face b"><div class="tag">Antwort</div><div class="a">'+k.a+'</div></div>'
    +'</div></div>'
    +'<div class="kbar">'+(flipped
      ? '<button class="ghost" id="bad">Nochmal</button><button id="good">Gewusst</button>'
      : '<button id="show">Antwort zeigen</button>')+'</div>'
    + (flipped && cardState(k.key)
       ? '<div class="muted mono" style="text-align:center;margin-top:10px;font-size:11.5px">bisher '
         + cardState(k.key).wdh + 'x gewusst · naechstes Intervall '
         + (cardState(k.key).iv||0) + ' Tage</div>' : '');
  document.getElementById('flip').onclick=()=>{ flipped=!flipped; drawDeck(); };
  const b=id=>document.getElementById(id);
  if(b('show')) b('show').onclick=e=>{ e.stopPropagation(); flipped=true; drawDeck(); };
  if(b('good')) b('good').onclick=e=>{ e.stopPropagation(); gradeCard(k.key,true);  di++; flipped=false; drawDeck(); drawRail(); };
  if(b('bad'))  b('bad').onclick =e=>{ e.stopPropagation(); gradeCard(k.key,false); di++; flipped=false; drawDeck(); drawRail(); };
}

/* ---------- Aufgaben ---------- */
function stepHTML(chId,ai,si,st,prefix){
  const key=(prefix||chId)+'|'+ai+'|'+si;
  const ex = prefix==='EX';
  const done= !ex && !!P.done[key];
  let h='<div class="step'+(done?' ok':'')+'" data-key="'+key+'" data-ch="'+chId+'" data-ai="'+ai+'" data-si="'+si+'">'
   +'<div class="step-q"><div class="step-n">'+(si+1)+'</div><div class="step-t">'+st.q+'</div></div>';
  if(st.t==='num'){
    h+='<div class="answer"><input type="text" inputmode="decimal" placeholder="Ergebnis" data-in>'
      +(st.unit?'<span class="unit">'+st.unit+'</span>':'')
      +(ex?'':'<button class="sm" data-check>Prüfen</button><button class="sm ghost" data-reveal>Lösungsweg</button>')+'</div>';
  } else if(st.t==='mc'){
    h+='<div class="opts">'+st.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'">'+o+'</button>').join('')+'</div>';
  } else if(st.t==='tf'){
    h+='<div class="answer"><button class="sm" data-tf="1">Wahr</button><button class="sm ghost" data-tf="0">Falsch</button></div>';
  } else {
    h+='<div class="answer" style="display:block"><textarea placeholder="'+(ex?'Antwort stichpunktartig notieren …':'Stichpunkte notieren (optional) …')+'"></textarea>'
      +(ex?'':'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="sm" data-reveal>Musterantwort</button>'
      +'<button class="sm ghost" data-mark>Sitzt</button></div>')+'</div>';
  }
  h+='<div class="fb" data-fb hidden></div></div>';
  return h;
}
function vAufgaben(c){
  let h='';
  c.aufgaben.forEach((a,ai)=>{
    h+='<div class="fall"><div class="fall-h"><h3>'+a.titel+'</h3></div>';
    if(a.kontext) h+='<div class="fall-k prose">'+a.kontext+'</div>';
    a.steps.forEach((st,si)=>{ h+=stepHTML(c.id,ai,si,st); });
    h+='</div>';
  });
  return h;
}

function vVerlauf(){

   +'<div class="sub">Jeder abgegebene Satz mit Punkten je Aufgabe. Interessant ist weniger die Prozentzahl '
